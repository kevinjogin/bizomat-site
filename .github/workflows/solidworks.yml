# Builds and tests the SOLIDWORKS add-in (solidworks/) on every push or pull request that touches it, and keeps
# the zip as a build artifact (Actions > the run > Artifacts > OpenSketch-SOLIDWORKS).
name: SOLIDWORKS add-in

on:
  push:
    paths: ["solidworks/**", ".github/workflows/solidworks.yml"]
  pull_request:
    paths: ["solidworks/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Build and test
        run: bash solidworks/build.sh test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenSketch-SOLIDWORKS
          path: solidworks/dist/OpenSketch-SOLIDWORKS
