# BIZOMAT on Fly.io: the website, the router behind bizomat.ai and Project Management, in the Fly app `bizomat` (syd).
# CAD Automation is its own Fly app, `cados` (repository kevinjogin/bizomat-cad), reached over Fly's private network.
#
# This file matches the Machines production runs, as read with `fly scale show -a bizomat` and `fly volumes list -a
# bizomat` on 9 Nov 2026: three Machines in syd (proxy shared-cpu-1x 256 MB, web shared-cpu-1x 512 MB, work
# shared-cpu-1x 512 MB) and the volume work_data (3 GB) on work. The `cad` group of the earlier plan (CAD inside this
# app, infrastructure/migrate/cad/README.md) never ran in production and was removed from this file on 9 Nov 2026;
# fly.toml still describes that plan and is not deployed.
#
#   bizomat.ai/...       -> web    the BIZOMAT website (this app)
#   bizomat.ai/cad/...   -> the Fly app `cados` at http://cados.internal:8080 (UPSTREAM_CAD below), with CAD's root
#                           program paths (CAD_PATHS in infrastructure/proxy/routes.mjs; docs/SITE-CAD-INTEGRATION.md)
#   bizomat.ai/tasks/... -> work   Project Management, in this app with its data on the volume work_data (moved from
#                                  Cloudflare on 6 Nov 2026: docs/BIZOMAT-DEPLOYMENT.md, section 6c)
#   bizomat.ai/login     -> 301    /sign-in/, the website's page that offers each application's sign-in
#   bizomat.fly.dev/...  -> 301    the same path on bizomat.ai (the app's own address is not a second address of the
#                                  platform; /__proxy/health and /__proxy/ready stay, for checks)
#
# Deployed only by hand from GitHub Actions (.github/workflows/bizomat-deploy.yml), which runs
#   flyctl deploy --config fly.website.toml --app bizomat --remote-only --ha=false --build-arg BIZOMAT_VERSION=<commit>
# after its preflight (.github/scripts/fly-preflight.py) has checked that the deploy keeps these Machines as they are.
# --ha=false keeps one Machine per group: work must never have two (each would get its own empty volume).

app = "bizomat"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "infrastructure/fly/Dockerfile"
  ignorefile = ".dockerignore"

[deploy]
  # rolling is the only strategy for Machines with volumes. work is offline while its Machine is replaced (10-60 s):
  # the proxy answers 502 for /tasks meanwhile and open boards reconnect. CAD (the cados app) is not affected.
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "10m"

[processes]
  proxy = "/usr/local/bin/bizomat-entrypoint proxy"
  web = "/usr/local/bin/bizomat-entrypoint web"
  work = "/usr/local/bin/bizomat-entrypoint work"

[env]
  UPSTREAM_WEB = "http://web.process.bizomat.internal:8003"
  UPSTREAM_WORK = "http://work.process.bizomat.internal:8002"
  # Where bizomat.ai/cad goes: the Fly app cados (repository kevinjogin/bizomat-cad), over the private network; it
  # listens on :: port 8080. Both apps must stay in the same Fly organization (docs/SITE-CAD-INTEGRATION.md).
  UPSTREAM_CAD = "http://cados.internal:8080"
  # bizomat.ai/tasks/... reaches work (no TASKS_REDIRECT_ORIGIN since the switch, 6 Nov 2026). To send it back to the old
  # address for a while: TASKS_REDIRECT_ORIGIN = "https://work.kevos.com" (302, prefix off).
  # Off outside a cutover: bizomat.fly.dev then answers 301 to bizomat.ai. "1" turns on the preview switch
  # (https://bizomat.fly.dev/__preview/{web,work,cad}) for checking a backend before it goes live.
  BIZOMAT_PREVIEW_ROUTING = "0"
  # work: passed to the work role as APP_URL, APP_NAME, ENVIRONMENT, ALLOW_SIGNUP and SESSION_TTL_HOURS
  # (infrastructure/fly/entrypoint.sh). Sign-up and session length as work.kevos.com runs today: open sign-up, 72 h.
  # It signs people in with email and password only; Google sign-in is off on work.kevos.com, so no secret is needed.
  WORK_APP_URL = "https://bizomat.ai/tasks"
  WORK_APP_NAME = "BIZOMAT Project Management"
  WORK_ENVIRONMENT = "production"
  WORK_ALLOW_SIGNUP = "true"
  WORK_SESSION_TTL_HOURS = "72"
  # Its address: a page asked for on another host (work.kevos.com once it points here, bizomat.fly.dev) answers 301 to
  # the same path under it; /api/ and the files keep answering there for open tabs.
  WORK_CANONICAL_URL = "https://bizomat.ai/tasks"
  # CAD Automation's address, the same as the cados app's fly.toml. The entrypoint passes OPENSKETCH_* to a cad role
  # only, and this app runs none since 9 Nov 2026, so these two have no effect here; they stay so that the Machines'
  # settings are unchanged and infrastructure/fly/test/check-config.py keeps checking the address.
  OPENSKETCH_PUBLIC_URL = "https://bizomat.ai/cad"
  OPENSKETCH_REDIRECT_HOSTS = "cados.fly.dev,cados.kevos.com,cad.bizomat.ai"

[http_service]
  processes = ["proxy"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 800
    hard_limit = 1500
  [http_service.http_options]
    idle_timeout = 600

[checks]
  [checks.proxy]
    processes = ["proxy"]
    type = "http"
    port = 8080
    method = "get"
    path = "/__proxy/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
  [checks.web]
    processes = ["web"]
    type = "http"
    port = 8003
    method = "get"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
  [checks.work]
    processes = ["work"]
    type = "http"
    port = 8002
    method = "get"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# Project Management's data: one volume on its one Machine (created by the first deploy), snapshotted daily and kept
# 30 days. The data move puts db.sqlite and files/ in /data/work (infrastructure/migrate/work).
[[mounts]]
  source = "work_data"
  destination = "/data"
  processes = ["work"]
  initial_size = "3gb"
  snapshot_retention = 30
  scheduled_snapshots = true
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "20GB"

[[vm]]
  processes = ["proxy"]
  size = "shared-cpu-1x"
  memory = "256mb"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["work"]
  size = "shared-cpu-1x"
  memory = "512mb"

# Restart work whenever its process exits (the entrypoint exits non-zero on a missing volume: the loop then shows in
# fly logs until it is fixed; in maintenance mode it stays up without the service, for a data move).
[[restart]]
  policy = "always"
  processes = ["work"]

