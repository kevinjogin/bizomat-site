name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:client
      - run: npm test
      - run: npm run build:worker
      - name: Artifact policy (no database, dump, backup or secret is ever uploaded)
        run: node scripts/check-artifact-policy.mjs
      - name: Secret scan (fail if credentials are committed)
        run: |
          if git grep -nE '(CLOUDFLARE_API_TOKEN|GOOGLE_CLIENT_SECRET)\s*[=:]\s*["'"'"']?[A-Za-z0-9_\-]{20,}' -- ':!*.md' ':!.env.example' ':!.github/**'; then
            echo "Possible secret committed"; exit 1; fi

  e2e:
    name: End-to-end (local Worker + Playwright)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Only the e2e run's own throwaway accounts and data (a fresh local Worker): never real customer data.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
