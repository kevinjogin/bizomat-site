# Deploy the BIZOMAT website platform to its Fly.io app `bizomat` (Sydney): the router (proxy), the website (web) and
# Project Management (work). Run by hand only:
#   Actions > BIZOMAT deploy (bizomat) > Run workflow on main, confirm = DEPLOY.
# No push, merge, tag or schedule starts it, so nothing reaches production by accident.
#
# It deploys fly.website.toml, the configuration production runs today (the laptop's `bizomat.ps1 deploy website`
# runs the same command), and only ever targets the app `bizomat` (fixed below). It never touches the app `cados`, DNS
# or Cloudflare, never creates an app, volume or IP address, and sets no secret. (fly.toml is the earlier single-app
# plan; it routes /cad inside this app and is not deployed by this workflow.)
#
# Repository secret (Settings > Secrets and variables > Actions):
# - FLY_BIZOMAT_TOKEN: a deploy token for the bizomat app only (Fly dashboard > bizomat > Tokens > Create deploy
#   token, or `fly tokens create deploy -a bizomat`). Only the steps that run flyctl see it.
#
# Steps: the preflight (.github/scripts/fly-preflight.py) compares fly.website.toml with the live Machines and stops
# when the deploy would add or remove a Machine or change its size, memory or region (allow_machine_change = YES lets a
# deliberate change through). fly.website.toml matches the live Machines (read from Fly on 9 Nov 2026: proxy, web and
# work in syd), so the preflight passes for it. Then the deploy (the image built on the runner with --local-only and
# pushed to Fly's registry; rolling, --ha=false: one Machine per group, replaced in place), a wait for
# https://bizomat.fly.dev/__proxy/health to report the new version, and the public checks the laptop tool runs.
#
# Rollback: `flyctl releases -a bizomat --image`, then
#   `flyctl deploy --config fly.website.toml -a bizomat --image <the previous image> --ha=false`
# (README.md, "Recovery and maintenance").
name: BIZOMAT deploy (bizomat)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to deploy main to production (Fly app bizomat)
        required: true
        default: ""
      allow_machine_change:
        description: Type YES only if the deploy is meant to change the Machines (groups, count, size, memory, region)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bizomat-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # As before the move, the deploy does not run BIZOMAT CI itself: run it first (Actions > BIZOMAT CI > Run workflow).
    if: inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP: bizomat
      CONFIG: fly.website.toml
    steps:
      - name: Check the token
        env:
          HAS_TOKEN: ${{ secrets.FLY_BIZOMAT_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the repository secret FLY_BIZOMAT_TOKEN (Fly dashboard > bizomat > Tokens > Create deploy token). Nothing was deployed."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Preflight (the deploy keeps the live Machines as they are)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BIZOMAT_TOKEN }}
          ALLOW_MACHINE_CHANGE: ${{ inputs.allow_machine_change }}
        run: python3 .github/scripts/fly-preflight.py --app "$APP" --config "$CONFIG"

      - name: The optional secrets (names only, never values)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BIZOMAT_TOKEN }}
        run: |
          names="$(flyctl secrets list --app "$APP" --json | jq -r '.[] | (.Name // .name)')"
          # WORK_ABR_GUID and WORK_BIZOMAT_ID_CLIENTS: company accounts (docs/company/README.md)
          for s in CF_ACCOUNT_ID CF_AI_TOKEN ANTHROPIC_API_KEY TURNSTILE_SECRET_KEY WORK_GOOGLE_CLIENT_ID WORK_GOOGLE_CLIENT_SECRET \
            WORK_ABR_GUID WORK_BIZOMAT_ID_CLIENTS; do
            if grep -qx "$s" <<<"$names"; then
              echo "Optional secret $s is set on $APP"
            else
              echo "::notice::Optional secret $s is not set on $APP"
            fi
          done

      # A restore point for Project Management's data before the new version starts (a new version can carry database
      # migrations). Fly also snapshots the volume daily (30 days), and the work server copies its database to
      # /data/work/pre-migration-backups/ before applying any migration. Restore: docs/deployment/fly-deployment.md.
      - name: Snapshot the work volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BIZOMAT_TOKEN }}
        run: |
          vol="$(flyctl volumes list --app "$APP" --json | jq -r '[.[] | select(.name == "work_data")][0].id // empty')"
          if [ -z "$vol" ]; then
            echo "::warning::No work_data volume found on $APP; no snapshot taken."
            exit 0
          fi
          if flyctl volumes snapshots create "$vol" --app "$APP"; then
            echo "- Snapshot of the work_data volume ($vol) requested before the deploy" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not snapshot $vol (the deploy token may not allow it). The daily snapshots and the server's pre-migration copy remain."
          fi

      # The image is built here, on the runner, as BIZOMAT CI builds it ("image and local stack"), then pushed to Fly's
      # registry. Fly's remote builder stopped answering during the website build on both attempts of the first
      # deploy from this workflow (10 Nov 2026), so it is not used.
      - name: Make room on the runner (the image builds the website, the .NET add-in and OpenCascade)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Deploy (rolling, one Machine per process group)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BIZOMAT_TOKEN }}
        run: |
          flyctl deploy --config "$CONFIG" --app "$APP" --local-only --ha=false \
            --build-arg BIZOMAT_VERSION="${GITHUB_SHA::7}" --wait-timeout 10m

      # flyctl reports success once the Machines run; ask the router itself which version it serves
      - name: The router serves the new version
        run: |
          want="${GITHUB_SHA::7}"
          got=""
          for _ in $(seq 1 36); do
            got="$(curl -fsS --max-time 10 "https://$APP.fly.dev/__proxy/health" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)"
            if [ "$got" = "$want" ]; then
              echo "BIZOMAT $want is running on the Fly app $APP" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$APP.fly.dev/__proxy/health did not show version $want within 3 minutes (last: ${got:-none}). See 'flyctl logs -a $APP'; to go back: README.md, Recovery and maintenance."
          exit 1

      # The checks the laptop tool runs after `bizomat.ps1 deploy website`. A backend can need a moment after the
      # router restarts, so each waits up to 90 s.
      - name: Public checks (bizomat.ai)
        run: |
          code() {  # HTTP status of $1; $2 = a JSON body to POST (optional)
            if [ -n "${2:-}" ]; then
              curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST -H 'content-type: application/json' --data "$2" "$1"
            else
              curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$1"
            fi
          }
          wait_for() { for _ in $(seq 1 18); do if eval "$2"; then echo "ok   $1"; echo "- ok: $1" >> "$GITHUB_STEP_SUMMARY"; return 0; fi; sleep 5; done; echo "FAIL $1"; echo "- FAILED: $1" >> "$GITHUB_STEP_SUMMARY"; return 1; }
          fail=0
          wait_for "the website answers (https://bizomat.ai/)" 'curl -fsS --max-time 15 https://bizomat.ai/ | grep -q BIZOMAT' || fail=1
          wait_for "its APIs answer (/api/chat with an empty body: 422, no AI call made)" '[ "$(code https://bizomat.ai/api/chat "{}")" = 422 ]' || fail=1
          wait_for "CAD Automation is reached over the private network (/cad/: 200)" '[ "$(code https://bizomat.ai/cad/)" = 200 ]' || fail=1
          wait_for "Project Management answers (/tasks/: 200 or 302)" 'c=$(code https://bizomat.ai/tasks/); [ "$c" = 200 ] || [ "$c" = 302 ]' || fail=1
          wait_for "BIZOMAT CRM answers (/crm/login: 200)" '[ "$(code https://bizomat.ai/crm/login)" = 200 ]' || fail=1
          wait_for "BIZOMAT Finance answers (/finance/login: 200)" '[ "$(code https://bizomat.ai/finance/login)" = 200 ]' || fail=1
          wait_for "BIZOMAT company accounts answer (/company/login: 200)" '[ "$(code https://bizomat.ai/company/login)" = 200 ]' || fail=1
          echo "info: bizomat.ai/login -> $(code https://bizomat.ai/login) (301 expected); bizomat.fly.dev/ -> $(code https://bizomat.fly.dev/) (301 expected)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$fail"
