# Cloudflare Worker of the BIZOMAT website, https://bizomat.ai (the Nov 2026 move from Fly.io to Cloudflare,
# docs/BIZOMAT-CLOUDFLARE-MIGRATION.md). It serves the static site from dist/ and runs src/worker.ts for anything that
# is not a file: the site's APIs, and the applications under bizomat.ai (routeApps): /cad and CAD Automation's root
# paths to the Worker bizomat-mcp, /tasks to the Worker bizomat-tasks, both by service binding.
#
# Deploys come from the owner's laptop only (`.\bizomat.ps1 cf deploy website`): [build] runs
# scripts/deploy-guard.mjs, which refuses Cloudflare's Workers Builds and any checkout that is not exactly
# origin/main. kevos.com is not here: it stays the KEVOS site on its own Worker (throbbing-block-6c61).
name = "bizomat"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
# https://bizomat.<account subdomain>.workers.dev: the site before bizomat.ai is switched over (noindex)
workers_dev = true

# Zone routes, not custom domains: they do nothing while the bizomat.ai and www.bizomat.ai records are DNS only (they
# point at Fly today). The switch is turning those two records to Proxied in the Cloudflare dashboard, and the way
# back is turning them to DNS only again (docs/BIZOMAT-CLOUDFLARE-MIGRATION.md, cutover).
routes = [
  { pattern = "bizomat.ai/*", zone_name = "bizomat.ai" },
  { pattern = "www.bizomat.ai/*", zone_name = "bizomat.ai" },
]

# scripts/deploy-guard.mjs: lets `npm run preview` through, refuses Workers Builds and stale or changed checkouts.
[build]
command = "node scripts/deploy-guard.mjs"

[[send_email]]
name = "EMAIL"
destination_address = "kevin@kevos.com"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# No run_worker_first: every path that is not a file reaches the Worker (/api/*, /insights, /cad, /tasks...). Its
# list form sends every other unmatched path to the 404 page instead, which broke the site's APIs on 6 Nov 2026.
# tests/worker.test.ts checks that no file takes an application's path instead.

# Project Management (bizomat.ai/tasks): the Worker bizomat-tasks (apps/work, --env bizomat), handed bizomat.ai/tasks/...
# unchanged; it has no address of its own.
[[services]]
binding = "TASKS"
service = "bizomat-tasks"

# CAD Automation (bizomat.ai/cad and the root paths it keeps, src/worker.ts CAD_PATHS): the Worker bizomat-mcp in
# front of the CAD server's container (CADOS cloudflare/mcp), handed the requests unchanged.
[[services]]
binding = "CAD"
service = "bizomat-mcp"

# Workers AI for the KEVOS Assistant. Workers Free plan: a daily allocation, no card needed.
[ai]
binding = "AI"

# Workers Builds uses `wrangler preview` for feature branches.
# Preview bindings are explicit; production settings above remain unchanged.
[previews.ai]
binding = "AI"

# Workers Logs (seven days), as for bizomat-mcp and bizomat-tasks.
[observability]
enabled = true

# Per-IP burst limits at the edge (Workers Rate Limiting API; no KV or paid plan needed).
# Keys are "<scope>:<client IP>" inside src/worker.ts; a request over the limit gets HTTP 429.
# namespace_id only has to be a unique number within this Cloudflare account (41001 and 41002 were the old Worker's).
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "42001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "FORM_LIMITER"
namespace_id = "42002"
simple = { limit = 5, period = 60 }

# Anonymous homepage discovery statistics (src/server/discover/handler.ts, POST /api/discover/event):
# event type, result kind and id, up to 8 search keywords and phone/desktop. No IP address, cookie or
# full question. Workers Analytics Engine creates the dataset on the first write. Read it with
# `node scripts/discovery/analytics-report.mjs` (needs an API token with Account Analytics: Read).
# Without this binding the endpoint still answers 204 and stores nothing.
# OFF: with this binding the production deploy failed on 2 Nov 2026 (Workers Builds, releases #33 and #34;
# previews do not apply it). Switch Analytics Engine on for the account in the Cloudflare dashboard, then
# uncomment these three lines and restore the statistics paragraph on the privacy page (tests/discovery.test.ts).
# [[analytics_engine_datasets]]
# binding = "DISCOVERY_EVENTS"
# dataset = "kevos_discovery"

# Optional rate limiting for the contact endpoint and the assistant.
# Create a KV namespace (Storage & Databases → KV), then uncomment and paste its id:
# [[kv_namespaces]]
# binding = "CONTACT_RATE_LIMIT"
# id = "<your-kv-namespace-id>"
