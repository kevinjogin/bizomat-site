# BIZOMAT on Fly.io: the website, the router behind bizomat.ai and Project Management (owner's decisions, 6 Nov 2026:
# the website on Fly.io, kevos.com back to the old KEVOS site on Cloudflare; Project Management on Fly.io at
# bizomat.ai/tasks).
#
#   bizomat.ai/...       -> web    the BIZOMAT website (this app)
#   bizomat.ai/cad/...   -> cad    CAD Automation: its own Fly app `cados`, over Fly's private network; it keeps its
#                                  data and its old addresses (cados.kevos.com, cados.fly.dev)
#   bizomat.ai/tasks/... -> work   Project Management, in this app with its data on the volume work_data. Until its data
#                                  is moved from Cloudflare and checked (docs/BIZOMAT-DEPLOYMENT.md, section 6c),
#                                  /tasks/... still answers 302 to work.kevos.com (TASKS_REDIRECT_ORIGIN), and the copy
#                                  here is reached only through https://bizomat.fly.dev/__preview/work
#
# Deploy from the owner's laptop: bizomat.ps1 deploy website, which runs
#   fly deploy --config fly.website.toml --remote-only --ha=false --build-arg BIZOMAT_VERSION=<commit>
# Same image as fly.toml (infrastructure/fly/Dockerfile, the full plan); the proxy, web and work groups run here.
# --ha=false keeps one Machine per group: work must never have two (each would get its own empty volume).

app = "bizomat"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "infrastructure/fly/Dockerfile"
  ignorefile = ".dockerignore"

[deploy]
  # rolling is the only strategy for Machines with volumes. work is offline while its Machine is replaced (10-60 s):
  # the proxy answers 502 meanwhile and open boards reconnect.
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "10m"

[processes]
  proxy = "/usr/local/bin/bizomat-entrypoint proxy"
  web = "/usr/local/bin/bizomat-entrypoint web"
  work = "/usr/local/bin/bizomat-entrypoint work"

[env]
  UPSTREAM_WEB = "http://web.process.bizomat.internal:8003"
  UPSTREAM_WORK = "http://work.process.bizomat.internal:8002"
  # CAD Automation's app on the private network. It listens on :: (IPv4 and IPv6), so 6PN reaches it.
  UPSTREAM_CAD = "http://cados.internal:8080"
  # Until Project Management's data is here and checked: bizomat.ai/tasks/... answers 302 to the same path on its old
  # address, prefix off. Removing this line is the switch (section 6c): /tasks/... then reaches work.
  TASKS_REDIRECT_ORIGIN = "https://work.kevos.com"
  # On while the data move is checked: https://bizomat.fly.dev/__preview/work routes that one browser to work (only on
  # bizomat.fly.dev, never on bizomat.ai). "0" again after the switch.
  BIZOMAT_PREVIEW_ROUTING = "1"
  # work: passed to the work role as APP_URL, APP_NAME, ENVIRONMENT, ALLOW_SIGNUP and SESSION_TTL_HOURS
  # (infrastructure/fly/entrypoint.sh). Sign-up and session length as work.kevos.com runs today: open sign-up, 72 h.
  # It signs people in with email and password only; Google sign-in is off on work.kevos.com, so no secret is needed.
  WORK_APP_URL = "https://bizomat.ai/tasks"
  WORK_APP_NAME = "BIZOMAT Project Management"
  WORK_ENVIRONMENT = "production"
  WORK_ALLOW_SIGNUP = "true"
  WORK_SESSION_TTL_HOURS = "72"

[http_service]
  processes = ["proxy"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 800
    hard_limit = 1500
  [http_service.http_options]
    idle_timeout = 600

[checks]
  [checks.proxy]
    processes = ["proxy"]
    type = "http"
    port = 8080
    method = "get"
    path = "/__proxy/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
  [checks.web]
    processes = ["web"]
    type = "http"
    port = 8003
    method = "get"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
  [checks.work]
    processes = ["work"]
    type = "http"
    port = 8002
    method = "get"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# Project Management's data: one volume on its one Machine (created by the first deploy), snapshotted daily and kept
# 30 days. The data move puts db.sqlite and files/ in /data/work (infrastructure/migrate/work).
[[mounts]]
  source = "work_data"
  destination = "/data"
  processes = ["work"]
  initial_size = "3gb"
  snapshot_retention = 30
  scheduled_snapshots = true
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "20GB"

[[vm]]
  processes = ["proxy"]
  size = "shared-cpu-1x"
  memory = "256mb"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["work"]
  size = "shared-cpu-1x"
  memory = "512mb"

# Restart work whenever its process exits (the entrypoint exits non-zero on a missing volume: the loop then shows in
# fly logs until it is fixed; in maintenance mode it stays up without the service, for the data move).
[[restart]]
  policy = "always"
  processes = ["work"]
