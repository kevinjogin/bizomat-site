# Deploy BIZOMAT CAD (the CAD MCP server in opensketch/: MCP, OAuth, the device bridge, installer and update
# endpoints) to its Fly.io app `cados` (Amsterdam, ams). This workflow is the only way production is deployed
# (owner, 16 Nov 2026): GitHub is the source, and Fly runs only an image this workflow built, tested and pushed.
#
# When it runs:
# - on a push to main (a merged pull request) that changes something the image is built from or how the Machine runs:
#   Dockerfile, .dockerignore, requirements.txt, opensketch/, solidworks/ (not its tests) or fly.toml
#   (tests/test_deploy_workflow.py keeps this list equal to the Dockerfile's COPY lines). Docs, workflows, scripts,
#   tests, the installer and backups reach GitHub without restarting production. A commit whose message contains
#   [skip ci] is not deployed.
# - by hand (Actions > Deploy to Fly.io (cados) > Run workflow):
#     action = deploy,     confirm = DEPLOY  deploy main as above (e.g. after a change the paths above leave out)
#     action = rollback,   confirm = DEPLOY  deploy an image already in Fly's registry, no build: image = sha-<commit>
#                                            (every deploy since 16 Nov 2026) or deployment-<id> (earlier releases;
#                                            `flyctl releases -a cados --image` lists them)
#     action = build-only                    build, smoke-test and push an image tagged check-<commit>-<run> from any
#                                            branch; nothing is deployed and no release is made
#
# How a deploy goes:
# 1. "test" (tests.yml: pytest in two parts, npm test, the Cloudflare Worker check) and "image" run side by side. The
#    image is built once on the runner from the commit (OPENSKETCH_VERSION = the commit's first 7 characters, labels
#    with the full commit), started as a container and smoke-tested (.github/scripts/image-smoke.sh), then pushed to
#    registry.fly.io/cados:sha-<commit>. Its digest is kept.
# 2. "deploy" runs only when both passed. Preflight (.github/scripts/fly-preflight.py: the deploy keeps the Machine's
#    count, size, memory and region); the image the Machine runs now is recorded; the optional secrets are staged; then
#    `flyctl deploy --image registry.fly.io/cados:sha-<commit>`: no build, the same Machine updated in place with its
#    volume (CAD MCP offline for about 15 s).
# 3. Core checks: /healthz reports the commit, the Machine runs the pushed digest, MCP refuses a request without a
#    token with a Bearer challenge, the OAuth metadata answers. If one fails, the recorded image is deployed again
#    (automatic rollback) and the run fails. Then the checks through bizomat.ai (the page, the installer download behind
#    sign-in, Sign in with BIZOMAT): a failure there fails the run without a rollback (the website may be the cause).
# 4. A release this run did not make (one more than its own) is reported: Fly's own GitHub deploy is still connected.
#
# Concurrency: one deploy at a time (group deploy-cados). A running deploy always finishes; of the runs waiting behind
# it, only the newest is kept, so a burst of merges ends with the newest commit live. A run whose commit is already live
# (a re-run) deploys nothing. Build-only runs never queue with deploys.
#
# Fly must not deploy by itself: no GitHub repository may be connected to the app in the Fly dashboard (cados >
# Settings). On 15 and 16 Nov 2026 one was (releases v22 to v34 built by Fly, version "dev"); step 4 reports it.
#
# Repository secrets (Settings > Secrets and variables > Actions):
# - FLY_CADOS_TOKEN: a deploy token for the cados app only (Fly dashboard > cados > Tokens > Create deploy token, or
#   `fly tokens create deploy -a cados`). It also pushes the image to registry.fly.io/cados. Until it is set nothing is
#   deployed. Only the steps that run flyctl or docker push see it.
# - GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET (optional), OPENSKETCH_ACCESS_CODE (optional), BIZOMAT_ID_CLIENT_SECRET
#   (optional: Sign in with BIZOMAT, opensketch/bizomat_id.py): passed to Fly as the app's secrets when set.
#
# Rollback by hand: action = rollback (above), or from a computer: `flyctl releases -a cados --image`, then
# `flyctl deploy -a cados --image <that image> --ha=false`. Volume snapshots: Fly dashboard > cados > Volumes.
name: Deploy to Fly.io (cados)

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "fly.toml"
      - "opensketch/**"
      - "solidworks/**"
      - "!solidworks/tests/**"
  workflow_dispatch:
    inputs:
      action:
        description: deploy (main, after the tests), rollback (an image already in Fly's registry) or build-only (any branch, nothing deployed)
        type: choice
        options: [deploy, rollback, build-only]
        default: deploy
      confirm:
        description: Type DEPLOY to deploy or roll back production (not needed for build-only)
        required: false
        default: ""
      image:
        description: "rollback only: sha-<40-character commit> or deployment-<id> (flyctl releases -a cados --image)"
        required: false
        default: ""
      skip_tests:
        description: deploy only, in an emergency - deploy without running the tests first (the image is still smoke-tested)
        type: boolean
        default: false
      allow_machine_change:
        description: Type YES only if the deploy is meant to change the Machines (count, size, memory, region)
        required: false
        default: ""

permissions:
  contents: read

env:
  APP: cados  # this workflow only ever targets the app cados
  REGISTRY_IMAGE: registry.fly.io/cados

# Deploys and rollbacks share one group (one at a time, the newest waiting run kept); build-only runs get their own.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'build-only') && format('cados-build-{0}', github.run_id) || 'deploy-cados' }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push' || (inputs.action == 'deploy' && inputs.confirm == 'DEPLOY' && !inputs.skip_tests)
    uses: ./.github/workflows/tests.yml

  image:
    if: github.event_name == 'push' || inputs.action == 'build-only' || (inputs.action == 'deploy' && inputs.confirm == 'DEPLOY')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.push.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
      config: ${{ steps.push.outputs.config }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Check the token
        env:
          HAS_TOKEN: ${{ secrets.FLY_CADOS_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the repository secret FLY_CADOS_TOKEN (Fly dashboard > cados > Tokens > Create deploy token). Nothing was built."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Sign docker in to Fly's registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
        run: flyctl auth docker > /dev/null

      - name: Build the image once
        id: build
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
        run: |
          df -h / | tail -1
          version="${GITHUB_SHA::7}"
          # Layers of the image production runs now, when it was built here (it carries inline cache data): unchanged
          # layers (the Python packages, the add-in build) are reused instead of being built again.
          machines="$(flyctl machine list --app "$APP" --json 2>/dev/null || echo '[]')"
          echo "The Machine's image now (read only):"; jq -c '[.[] | .image_ref]' <<<"$machines" || true
          live="$(jq -r 'first(.[] | .image_ref | select(.repository != null) | "\(.registry)/\(.repository):\(.tag)") // empty' <<<"$machines" 2>/dev/null || true)"
          cache=()
          if [[ "$live" == "$REGISTRY_IMAGE":sha-* ]]; then cache=(--cache-from "$live"); echo "Reusing layers of $live"; fi
          DOCKER_BUILDKIT=1 docker build "${cache[@]}" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg OPENSKETCH_VERSION="$version" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            -t cados-candidate:"$GITHUB_SHA" .
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the image as a container
        run: bash .github/scripts/image-smoke.sh cados-candidate:"$GITHUB_SHA" "${GITHUB_SHA::7}"

      - name: The container's log
        if: always()
        run: cat "$RUNNER_TEMP/cados-smoke.log" 2>/dev/null | tail -n 60 || true

      - name: Push it to Fly's registry
        id: push
        env:
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$ACTION" = build-only ]; then
            tag="check-$GITHUB_SHA-$GITHUB_RUN_ID"
          else
            tag="sha-$GITHUB_SHA"
          fi
          docker tag cados-candidate:"$GITHUB_SHA" "$REGISTRY_IMAGE:$tag"
          docker push "$REGISTRY_IMAGE:$tag" | tail -n 3
          digest="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REGISTRY_IMAGE:$tag" | grep "^$REGISTRY_IMAGE@" | head -1 | cut -d@ -f2)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::The registry did not return a digest for $tag."; exit 1; fi
          # The image's config digest, as the registry holds it: Fly deploys the image under its own deployment-<id> tag
          # with a rewritten manifest (another manifest digest), but the configuration, and so every layer, is the same.
          config="$(bash .github/scripts/image-config.sh "$REGISTRY_IMAGE@$digest")"
          if [[ ! "$config" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::The registry did not return the config digest of $tag."; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          {
            echo "### Image"
            echo "- built once from \`$GITHUB_SHA\` (version \`${GITHUB_SHA::7}\`), smoke-tested as a container"
            echo "- pushed as \`$REGISTRY_IMAGE:$tag\`, digest \`$digest\`, config \`$config\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [test, image]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.test.result == 'success' && needs.image.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY' && inputs.action == 'deploy' &&
         needs.image.result == 'success' &&
         (needs.test.result == 'success' || (needs.test.result == 'skipped' && inputs.skip_tests))) ||
        (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY' && inputs.action == 'rollback')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The public address (OAuth metadata, pairing and download links). The core checks use cados.fly.dev, the origin
      # that always answers (an old host: pages there redirect, programs keep working).
      PUBLIC_URL: https://bizomat.ai/cad
      ORIGIN: https://cados.fly.dev
      ACTION: ${{ github.event_name == 'push' && 'deploy' || inputs.action }}
      ROLLBACK_IMAGE: ${{ inputs.image }}
      BUILT_TAG: ${{ needs.image.outputs.tag }}
      BUILT_DIGEST: ${{ needs.image.outputs.digest }}
      BUILT_CONFIG: ${{ needs.image.outputs.config }}
    steps:
      - name: Check the token and what to deploy
        id: what
        env:
          HAS_TOKEN: ${{ secrets.FLY_CADOS_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the repository secret FLY_CADOS_TOKEN (Fly dashboard > cados > Tokens > Create deploy token). Nothing was deployed."
            exit 1
          fi
          if [ "$ACTION" = rollback ]; then
            if [[ "$ROLLBACK_IMAGE" =~ ^sha-[0-9a-f]{40}$ ]]; then want="${ROLLBACK_IMAGE:4:7}"
            elif [[ "$ROLLBACK_IMAGE" =~ ^deployment-[0-9A-Za-z]{10,40}$ ]]; then want=""
            else echo "::error::image must be sha-<40-character commit> or deployment-<id> (flyctl releases -a cados --image)."; exit 1; fi
            ref="$REGISTRY_IMAGE:$ROLLBACK_IMAGE"; digest=""; config=""
          else
            if [[ ! "$BUILT_TAG" =~ ^sha-[0-9a-f]{40}$ ]] || [[ ! "$BUILT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The image job left no tested image to deploy."; exit 1
            fi
            want="${GITHUB_SHA::7}"; ref="$REGISTRY_IMAGE:$BUILT_TAG"; digest="$BUILT_DIGEST"; config="$BUILT_CONFIG"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "want=$want" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "To deploy: $ref ${digest:-} (version ${want:-as built})"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Preflight (the deploy keeps the live Machines as they are)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
          # only a deploy by hand can allow a change to the Machines; an automatic deploy never does
          ALLOW_MACHINE_CHANGE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_machine_change || '' }}
        run: python3 .github/scripts/fly-preflight.py --app "$APP" --config fly.toml

      - name: Record what runs now
        id: before
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
          WANT: ${{ steps.what.outputs.want }}
        run: |
          machines="$(flyctl machine list --app "$APP" --json)"
          image="$(jq -r 'first(.[] | .image_ref | "\(.registry)/\(.repository):\(.tag)")' <<<"$machines")"
          digest="$(jq -r 'first(.[] | .image_ref.digest // empty)' <<<"$machines")"
          release="$(flyctl releases --app "$APP" --json | jq -r '[.[] | (.Version // .version)] | max')"
          live="$(curl -fsS --max-time 10 "$ORIGIN/healthz" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$live" >> "$GITHUB_OUTPUT"
          echo "Running now: $image ($digest), release v$release, version ${live:-no answer}"
          if [ "$live" = dev ]; then
            echo "::warning::Production reports version dev: Fly built and deployed it by itself. Disconnect the GitHub repository from cados in the Fly dashboard (cados > Settings)."
          fi
          skip=false
          if [ "$ACTION" = deploy ] && [ -n "$WANT" ] && [ "$live" = "$WANT" ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            skip=true
            echo "Version $WANT is already live (a re-run): nothing to deploy." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Pass optional secrets to Fly
        if: steps.before.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
          OPENSKETCH_ACCESS_CODE: ${{ secrets.OPENSKETCH_ACCESS_CODE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BIZOMAT_ID_CLIENT_SECRET: ${{ secrets.BIZOMAT_ID_CLIENT_SECRET }}
        # NAME=VALUE lines on standard input (flyctl secrets import): never on a command line, never in the log; only the
        # names are printed. Staged, they reach the Machine with the deploy below (no restart of their own).
        run: |
          lines=()
          if [ -n "$OPENSKETCH_ACCESS_CODE" ]; then lines+=("OPENSKETCH_ACCESS_CODE=$OPENSKETCH_ACCESS_CODE"); fi
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            lines+=("GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET")
          fi
          if [ -n "$BIZOMAT_ID_CLIENT_SECRET" ]; then lines+=("BIZOMAT_ID_CLIENT_SECRET=$BIZOMAT_ID_CLIENT_SECRET"); fi
          if [ "${#lines[@]}" -gt 0 ]; then
            printf '%s\n' "${lines[@]}" | flyctl secrets import --stage --app "$APP" > /dev/null
            echo "Staged on $APP: $(printf '%s\n' "${lines[@]}" | cut -d= -f1 | paste -sd ' ')"
          else
            echo "No optional secrets to pass."
          fi

      - name: Deploy the tested image (no build)
        id: deploy
        if: steps.before.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
          REF: ${{ steps.what.outputs.ref }}
        run: |
          flyctl deploy --app "$APP" --config fly.toml --image "$REF" --ha=false \
            --env OPENSKETCH_PUBLIC_URL="$PUBLIC_URL"

      # flyctl reports success once the Machine runs, even when the server inside never answers (the supervisor keeps the
      # Machine alive for a while): ask the server itself, and the Machine which image it runs.
      - name: Core checks (a failure rolls back)
        id: verify
        if: steps.before.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
          WANT: ${{ steps.what.outputs.want }}
          WANT_DIGEST: ${{ steps.what.outputs.digest }}
          WANT_CONFIG: ${{ steps.what.outputs.config }}
        run: bash .github/scripts/cados-checks.sh core

      - name: Roll back to the image that ran before
        id: rollback
        if: failure() && steps.before.outputs.skip != 'true' && env.ACTION == 'deploy' && steps.before.outputs.image != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
          BEFORE_IMAGE: ${{ steps.before.outputs.image }}
          BEFORE_DIGEST: ${{ steps.before.outputs.digest }}
          BEFORE_VERSION: ${{ steps.before.outputs.version }}
        run: |
          now="$(flyctl machine list --app "$APP" --json | jq -r 'first(.[] | .image_ref.digest // empty)')"
          if [ -n "$BEFORE_DIGEST" ] && [ "$now" = "$BEFORE_DIGEST" ]; then
            echo "The Machine still runs the image from before ($BEFORE_IMAGE): nothing to roll back." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::Rolling back to $BEFORE_IMAGE ($BEFORE_DIGEST)."
          flyctl deploy --app "$APP" --config fly.toml --image "$BEFORE_IMAGE" --ha=false --env OPENSKETCH_PUBLIC_URL="$PUBLIC_URL"
          WANT="$BEFORE_VERSION" WANT_DIGEST="$BEFORE_DIGEST" bash .github/scripts/cados-checks.sh core
          echo "Rolled back to $BEFORE_IMAGE (version ${BEFORE_VERSION:-unknown}): the new image failed its core checks." >> "$GITHUB_STEP_SUMMARY"

      - name: Checks through bizomat.ai (a failure does not roll back)
        if: steps.before.outputs.skip != 'true' && steps.verify.outcome == 'success'
        run: bash .github/scripts/cados-checks.sh public

      # Sign in with BIZOMAT (opensketch/bizomat_id.py, docs/SITE-CAD-INTEGRATION.md section 8): with the secret set, the
      # sign-in page offers it, and BIZOMAT holds the SHA-256 of this repository's secret. The second is proved without
      # printing anything: BIZOMAT's token endpoint is asked to swap a made-up code with the client cad's credentials. The
      # same secret answers invalid_grant (400); another secret, or no client cad on BIZOMAT, answers invalid_client
      # (401). The secret reaches curl on standard input, never on a command line. Nothing is written on either side but a
      # rate-limit count.
      - name: Sign in with BIZOMAT (the secret is never printed)
        if: steps.before.outputs.skip != 'true' && steps.verify.outcome == 'success'
        env:
          BIZOMAT_ID_CLIENT_SECRET: ${{ secrets.BIZOMAT_ID_CLIENT_SECRET }}
        run: |
          if [ -z "$BIZOMAT_ID_CLIENT_SECRET" ]; then
            echo "Sign in with BIZOMAT: BIZOMAT_ID_CLIENT_SECRET is not set in this repository, so it stays off." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          offered=0
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 15 -H 'Accept: text/html' "$PUBLIC_URL/login" | grep -q 'with BIZOMAT'; then offered=1; break; fi
            sleep 5
          done
          if [ "$offered" != 1 ]; then echo "::error::The sign-in page does not offer Sign in with BIZOMAT although the secret is set."; exit 1; fi
          code="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          verifier="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          answer="$(printf 'user = "cad:%s"\n' "$BIZOMAT_ID_CLIENT_SECRET" | curl -s -K - --max-time 15 -w '\n%{http_code}' \
            --data-urlencode grant_type=authorization_code --data-urlencode "code=$code" --data-urlencode "code_verifier=$verifier" \
            --data-urlencode redirect_uri=https://bizomat.ai/cad/auth/bizomat/callback https://bizomat.ai/company/api/id/token)"
          status="$(tail -n1 <<<"$answer")"; error="$(head -n -1 <<<"$answer" | jq -r '.error // empty' 2>/dev/null || true)"
          if [ "$status" = 400 ] && [ "$error" = invalid_grant ]; then
            echo "Sign in with BIZOMAT: offered on the sign-in page, and BIZOMAT holds this repository's secret (a made-up code was refused as invalid_grant)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::BIZOMAT does not take this repository's BIZOMAT_ID_CLIENT_SECRET (HTTP $status, ${error:-no error code}): the secret differs from kevinjogin/bizomat-site's, or bizomat has not been deployed with the client cad yet."
            exit 1
          fi

      - name: Releases this run did not make (Fly building by itself)
        if: always() && steps.before.outputs.release != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
          BEFORE: ${{ steps.before.outputs.release }}
          DEPLOYED: ${{ steps.deploy.outcome == 'success' && '1' || '0' }}
          ROLLED: ${{ steps.rollback.outcome == 'success' && '1' || '0' }}
        run: |
          now="$(flyctl releases --app "$APP" --json | jq -r '[.[] | (.Version // .version)] | max')"
          made=$((DEPLOYED + ROLLED))
          extra=$((now - BEFORE - made))
          echo "Releases: v$BEFORE before, v$now now, $made made by this run."
          if [ "$extra" -gt 0 ]; then
            echo "::warning::$extra release(s) appeared that this run did not make: Fly's own GitHub deploy is probably still connected to cados. Disconnect it in the Fly dashboard (cados > Settings)."
            echo "- WARNING: $extra release(s) this run did not make (Fly building by itself?)" >> "$GITHUB_STEP_SUMMARY"
          fi
