# Cloudflare Worker configuration for kevos.com.
# Deploy with:  npm run deploy   (builds, checks, then `wrangler deploy`)
#
# The Worker serves the static site from dist/ and runs src/worker.ts for anything that is not
# a file, which is how /api/chat (KEVOS Assistant) and /api/contact work.

# Name of the existing Worker that already serves kevos.com. If you rename the Worker in the
# Cloudflare dashboard, change this to match, or a second Worker will be created.
name = "throbbing-block-6c61"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
workers_dev = false

# kevos.com already has DNS records. Bind the Worker as a route instead of
# asking Wrangler to recreate the hostname as a Worker custom domain.
routes = [
  { pattern = "kevos.com/*", zone_name = "kevos.com" },
]

# Contact delivery: onboard kevos.com in Email Service and verify this destination.
# TURNSTILE_SECRET_KEY belongs in this Worker's encrypted secrets, never in this file.
[[send_email]]
name = "EMAIL"
destination_address = "kevin@kevos.com"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Workers AI for the KEVOS Assistant. Workers Free plan: a daily allocation, no card needed.
[ai]
binding = "AI"

# Workers Builds uses `wrangler preview` for feature branches.
# Preview bindings are explicit; production settings above remain unchanged.
[previews.ai]
binding = "AI"

# Workers Logs are off, matching the setting chosen in the Cloudflare dashboard (29 Oct 2026).
[observability]
enabled = false

# Per-IP burst limits at the edge (Workers Rate Limiting API; no KV or paid plan needed).
# Keys are "<scope>:<client IP>" inside src/worker.ts; a request over the limit gets HTTP 429.
# namespace_id only has to be a unique number within this Cloudflare account.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "41001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "FORM_LIMITER"
namespace_id = "41002"
simple = { limit = 5, period = 60 }

# Anonymous homepage discovery statistics (src/server/discover/handler.ts, POST /api/discover/event):
# event type, result kind and id, up to 8 search keywords and phone/desktop. No IP address, cookie or
# full question. Workers Analytics Engine creates the dataset on the first write. Read it with
# `node scripts/discovery/analytics-report.mjs` (needs an API token with Account Analytics: Read).
# Without this binding the endpoint still answers 204 and stores nothing.
# OFF: with this binding the production deploy failed on 2 Nov 2026 (Workers Builds, releases #33 and #34;
# previews do not apply it). Switch Analytics Engine on for the account in the Cloudflare dashboard, then
# uncomment these three lines and restore the statistics paragraph on the privacy page (tests/discovery.test.ts).
# [[analytics_engine_datasets]]
# binding = "DISCOVERY_EVENTS"
# dataset = "kevos_discovery"

# Optional rate limiting for the contact endpoint and the assistant.
# Create a KV namespace (Storage & Databases → KV), then uncomment and paste its id:
# [[kv_namespaces]]
# binding = "CONTACT_RATE_LIMIT"
# id = "<your-kv-namespace-id>"
