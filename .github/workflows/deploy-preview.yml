name: Deploy preview

# Feature branches -> an independent preview URL on the PREVIEW Worker
# (workos-platform-preview). Previews use the preview D1/R2/KV only and can
# never reach production data.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: preview
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build:client && npm test
      - name: Apply migrations to PREVIEW database
        run: npx wrangler d1 migrations apply DB --remote --env preview
      - name: Upload preview version with branch alias
        id: upload
        run: |
          ALIAS=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          npx wrangler versions upload --env preview --preview-alias "$ALIAS" --message "${GITHUB_SHA::7} ${GITHUB_REF_NAME}" | tee upload.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' upload.log | grep "$ALIAS" | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Smoke test preview
        if: steps.upload.outputs.url != ''
        run: node scripts/smoke.mjs "${{ steps.upload.outputs.url }}"
      - name: Summary
        run: echo "Preview URL: ${{ steps.upload.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
