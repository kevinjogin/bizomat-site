<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="ap-title ap-desc" class="lv">
  <title id="ap-title">How approvals work in BIZOMAT ERP</title>
  <desc id="ap-desc">A record starts as a draft. The person who drafted it submits it. A different person with the approving role approves or rejects it: nobody approves what they drafted. A rejected record goes back to draft to be changed. An approved record moves on, for example a purchase order is sent, a revision is released or a routing is used in production, and it can no longer be changed in place.</desc>
  <defs><marker id="ap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="lv-arrowhead"/></marker></defs>
  <rect x="20" y="70" width="150" height="70" rx="12" class="lv-box"/><text x="95" y="102" class="lv-head" text-anchor="middle">Draft</text><text x="95" y="124" class="lv-small" text-anchor="middle">you create and edit</text>
  <rect x="230" y="70" width="160" height="70" rx="12" class="lv-box"/><text x="310" y="102" class="lv-head" text-anchor="middle">Submitted</text><text x="310" y="124" class="lv-small" text-anchor="middle">waiting for approval</text>
  <rect x="450" y="20" width="190" height="70" rx="12" class="lv-core"/><text x="545" y="52" class="lv-core-title" text-anchor="middle">Approved</text><text x="545" y="74" class="lv-core-sub" text-anchor="middle">by someone else</text>
  <rect x="450" y="130" width="190" height="70" rx="12" class="lv-box lv-box--warn"/><text x="545" y="162" class="lv-head" text-anchor="middle">Rejected</text><text x="545" y="184" class="lv-small" text-anchor="middle">with a reason</text>
  <rect x="700" y="20" width="180" height="70" rx="12" class="lv-box"/><text x="790" y="52" class="lv-head" text-anchor="middle">Released or sent</text><text x="790" y="74" class="lv-small" text-anchor="middle">no longer changed in place</text>
  <g class="lv-flows">
    <path d="M172 105 L226 105" marker-end="url(#ap-arrow)"/>
    <path d="M392 96 L446 62" marker-end="url(#ap-arrow)"/>
    <path d="M392 114 L446 160" marker-end="url(#ap-arrow)"/>
    <path d="M642 55 L696 55" marker-end="url(#ap-arrow)"/>
    <path d="M450 190 Q100 228 92 146" marker-end="url(#ap-arrow)"/>
  </g>
  <text x="250" y="222" class="lv-small">back to draft to change it</text>
</svg>
