# Temporary diagnostic: WORKOS calculator links on the live kevos.com (WebKit iPhone, timing). Removed after use.
name: Live check (tools after on-demand loading)
on:
  push:
    branches: [claude/loving-mccarthy-oubwh2]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browsers
        run: npm i --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps webkit chromium
      - name: Check live tools
        shell: bash
        run: |
          cat > check.mjs <<'JS'
          import { webkit, chromium, devices } from 'playwright';
          const note = (t, m) => console.log(`::notice title=${t}::${String(m).slice(0, 1500)}`);
          const b = await webkit.launch();
          const ctx = await b.newContext(devices['iPhone 13']);
          const p = await ctx.newPage();
          const errs = [];
          p.on('pageerror', (e) => errs.push(e.message));
          p.on('console', (m) => m.type() === 'error' && errs.push(m.text()));
          await p.goto('https://kevos.com/tools/axial-stress/', { waitUntil: 'load' });
          await Promise.all([p.waitForURL('**/tools/?tool=axial-stress', { waitUntil: 'load' }), p.locator('a.btn', { hasText: 'Open the calculator' }).first().click()]);
          const t1 = Date.now();
          await p.waitForFunction(() => window.WORKOS_UI?.state()?.t.id === 'axial-stress', null, { timeout: 30000 }).catch((e) => note('webkit wait', e.message.slice(0, 200)));
          note('webkit open after page load', `${Date.now() - t1} ms`);
          const s = await p.evaluate(() => ({ url: location.pathname + location.search, tool: document.querySelector('#tool-name')?.textContent, workspace: !document.querySelector('#tool-workspace').hidden, directory: !document.querySelector('#tool-directory').hidden, guides: document.querySelectorAll('#tool-form details.ig').length, loadedTools: (window.GOCORE_TOOLS || []).length, scripts: [...document.scripts].filter((x) => /\/tools\//.test(x.src)).map((x) => x.src.split('/tools/')[1]).join(' ') }));
          note('webkit iphone, Open the calculator on axial-stress', JSON.stringify(s));
          for (const id of ['roi', 'extension-spring', 'turning-power', 'spur-gear-set-design']) {
            await p.goto(`https://kevos.com/tools/?tool=${id}`, { waitUntil: 'load' });
            await p.waitForFunction((id) => window.WORKOS_UI?.state()?.t.id === id, id, { timeout: 30000 }).catch(() => {});
            note(`webkit iphone direct ${id}`, JSON.stringify(await p.evaluate(() => ({ tool: document.querySelector('#tool-name')?.textContent, directory: !document.querySelector('#tool-directory').hidden, guides: document.querySelectorAll('#tool-form details.ig').length }))));
          }
          note('webkit iphone errors', errs.length ? errs.slice(0, 5).join(' | ') : 'none');
          await b.close();
          const c = await chromium.launch();
          try { for (const [name, net] of [['4G', { latency: 85, downloadThroughput: 9e6 / 8, uploadThroughput: 1.5e6 / 8 }], ['slow 4G', { latency: 150, downloadThroughput: 1.6e6 / 8, uploadThroughput: 0.75e6 / 8 }]]) {
            const x = await c.newContext(devices['iPhone 13']); const q = await x.newPage(); const cdp = await x.newCDPSession(q);
            await cdp.send('Network.enable'); await cdp.send('Network.setCacheDisabled', { cacheDisabled: true });
            await cdp.send('Network.emulateNetworkConditions', { offline: false, ...net }); await cdp.send('Emulation.setCPUThrottlingRate', { rate: 4 });
            let reqs = 0; q.on('request', () => reqs++);
            const t0 = Date.now();
            await q.goto('https://kevos.com/tools/?tool=axial-stress', { waitUntil: 'commit' });
            // Poll from Node: the site's CSP (no unsafe-eval) blocks Playwright's in-page polling.
            let dir = false, open = false;
            while (Date.now() - t0 < 120000 && !open) {
              const st = await q.evaluate(() => { const d = document.querySelector('#tool-directory'); return { dir: !!d && getComputedStyle(d).display !== 'none' && d.getBoundingClientRect().height > 0, open: window.WORKOS_UI?.state()?.t.id === 'axial-stress' }; }).catch(() => ({ dir: false, open: false }));
              dir = dir || st.dir; open = st.open;
              if (!open) await new Promise((r) => setTimeout(r, 100));
            }
            note(`timing ${name}`, `calculator after ${((Date.now() - t0) / 1000).toFixed(1)} s, ${reqs} requests, directory shown: ${dir}`);
            await x.close();
          } } catch (e) { note('timing error', e.message.slice(0, 600)); }
          await c.close();
          JS
          node check.mjs
