# BIZOMAT CI: the website, CAD MCP (apps/cad), Task Management (apps/work), the edge proxy, the platform image and
# the single 1 GB machine. Runs on every push and pull request, and as the gate of every deploy (deploy.yml calls it).
# Read-only: no secrets, nothing deployed, nothing pushed.
#
# Jobs: website (brand copies, verify), work (lint, types, tests, builds incl. the Node server), cad (pytest in two
# parts, npm test), proxy (tests, script and config checks, the single-app tests), image (Docker build of
# infrastructure/fly/Dockerfile, a migration round trip inside it, the single machine in a 1 GB container with the
# smoke test and its memory use, then the compose stack with the smoke test and the secret-isolation check).
name: BIZOMAT CI

on:
  push:
    branches-ignore: [main] # main is checked by deploy.yml, which calls this workflow before it deploys
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: bizomat-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment); Dependabot proposes updates.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      # before the build: the build rewrites any copy that is out of step, which would hide it
      - name: Brand copies in step across the website and both apps
        run: node shared/brand/build.mjs --check
      - name: Check, test and build the site
        run: npm run verify
      - name: Build the website's Node server (the Fly web process)
        run: npm run build:server

  work:
    name: work
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/work
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/work/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:node
      - run: npm run build:node

  cad:
    name: cad pytest (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/cad
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: main
            select: not slow
          - part: worker processes
            select: slow
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/cad/requirements-dev.txt
      # node runs the sketch solver (opensketch/solver)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # .NET runs the C# Companion and add-in link in the slow end-to-end test
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: matrix.part == 'worker processes'
        with:
          dotnet-version: "8.0.x"
      - name: Libraries OpenCascade needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgl1 libglu1-mesa libxrender1 libxext6 libx11-6
      - name: Python packages (exact versions)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: pytest
        env:
          SELECT: ${{ matrix.select }}
        run: python -m pytest -q -ra --timeout=900 -m "$SELECT"

  cad-npm:
    name: cad npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cad
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/cad/package-lock.json
      - run: npm ci
      - run: npm test

  proxy:
    name: proxy and platform files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Proxy tests (routing, headers, streaming, WebSockets, a 25 s long poll)
        run: node --test 'infrastructure/proxy/test/*.test.mjs'
      - name: Scripts parse
        run: |
          node --check infrastructure/smoke/smoke.mjs
          node --check infrastructure/local/stub-upstream.mjs
          python3 -m py_compile infrastructure/migrate/lib/*.py infrastructure/migrate/work/*.py infrastructure/fly/*.py infrastructure/fly/test/*.py
      - name: Shell scripts (shellcheck)
        run: shellcheck infrastructure/fly/entrypoint.sh infrastructure/fly/adopt-cados-volume.sh infrastructure/fly/test/*.sh infrastructure/migrate/*.sh infrastructure/migrate/*/*.sh infrastructure/local/*.sh
      # The single machine: the cados volume's adoption (byte for byte, resume, refusals, undo) and the supervisor of
      # cad, work and proxy (own process group each, restart, SIGTERM). Root, as the entrypoint requires.
      - name: Single application (adopt-cados-volume.sh, bizomat-entrypoint all)
        run: sudo bash infrastructure/fly/test/single-app.test.sh
      - name: fly.toml (app cados, syd, one Machine of 1 GB, one volume, the services and their checks)
        run: python3 infrastructure/fly/test/check-config.py fly.toml
      - name: The compose files read
        run: |
          docker compose -f infrastructure/local/compose.yml config -q
          docker compose -f infrastructure/local/compose.yml -f infrastructure/local/compose.stubs.yml config -q

  image:
    name: image and local stack
    needs: proxy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIZOMAT_IMAGE: bizomat:ci
      COMPOSE_PROJECT_NAME: bizomat-ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Make room on the runner (the image builds the website, the .NET add-in and OpenCascade)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build the platform image (all four roles; nothing is pushed)
        run: docker build -f infrastructure/fly/Dockerfile -t "$BIZOMAT_IMAGE" --build-arg BIZOMAT_VERSION="${GITHUB_SHA::7}" .
      - name: Image size
        run: docker image ls "$BIZOMAT_IMAGE" --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Entrypoint (secret isolation per role, volumes, secret files, maintenance mode, refusals)
        run: bash infrastructure/fly/test/entrypoint.test.sh "$BIZOMAT_IMAGE"
      - name: Migration round trip in the image (export, restore, verify)
        run: docker run --rm --network none -v "$PWD/infrastructure/migrate/test:/t:ro" "$BIZOMAT_IMAGE" bash /t/roundtrip.sh
      # The production Machine as fly.toml runs it: one container, `bizomat-entrypoint all` (cad, work, the proxy with
      # the website inside), capped at 1 GB with no extra swap. The smoke test runs inside it through the proxy, then
      # the memory it used is reported. A test owner account is made so CAD MCP starts (an empty CAD server waits).
      - name: Single machine in 1 GB (smoke test inside, memory reported)
        run: |
          set -euo pipefail
          docker volume create bz1g >/dev/null
          docker run --rm -v bz1g:/data "$BIZOMAT_IMAGE" bash -c 'install -d -o 10004 -g 10004 -m 0700 /data/cad && cd /app/cad && \
            setpriv --reuid=10004 --regid=10004 --init-groups env OPENSKETCH_DATA=/data/cad HOME=/tmp /opt/cad/venv/bin/python -c \
            "from opensketch import accounts; accounts.create_owner(\"owner@example.invalid\", \"CI Owner\", \"ci-only-passphrase-123456\")"'
          envs=()
          while IFS='=' read -r k v; do envs+=(-e "$k=$v"); done < <(python3 -c 'import tomllib; [print(f"{k}={v}") for k, v in tomllib.load(open("fly.toml", "rb"))["env"].items()]')
          # no Fly edge in front here: the proxy treats the local requests as HTTPS, as the compose stack does
          docker run -d --name bz1g --memory 1g --memory-swap 1g -v bz1g:/data "${envs[@]}" -e PROXY_ASSUME_HTTPS=1 "$BIZOMAT_IMAGE" /usr/local/bin/bizomat-entrypoint all
          ok=""
          for _ in $(seq 1 60); do
            if docker exec bz1g node -e "fetch('http://127.0.0.1:8080/__proxy/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"; then ok=1; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { docker logs bz1g | tail -80; echo "::error::the single machine did not become ready"; exit 1; }
          docker exec bz1g node /usr/local/lib/bizomat/smoke/smoke.mjs http://127.0.0.1:8080 --mode hosts
          docker exec bz1g sh -c 'for p in /proc/[0-9]*; do c=$(tr "\0" " " <$p/cmdline 2>/dev/null); r=$(awk "/VmRSS/{print \$2}" $p/status 2>/dev/null); [ -n "$r" ] && echo "$r $c"; done' \
            | sort -rn | head -8 | awk '{printf "%6d MB  %s %s %s\n", $1/1024, $2, $3, $4}' | tee -a "$GITHUB_STEP_SUMMARY"
          used="$(docker stats --no-stream --format '{{.MemUsage}}' bz1g)"
          echo "Single machine, all services: $used (limit 1 GiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(docker inspect -f '{{.State.OOMKilled}}' bz1g)" = false ] || { echo "::error::out of memory at 1 GB"; exit 1; }
      - name: Single machine logs
        if: failure()
        run: docker logs bz1g 2>&1 | tail -150 || true
      - name: Remove the single machine
        if: always()
        run: docker rm -f bz1g >/dev/null 2>&1 || true; docker volume rm bz1g >/dev/null 2>&1 || true
      - name: Start the local stack (the same image)
        run: docker compose -f infrastructure/local/compose.yml up -d --wait --wait-timeout 300 --no-build
      - name: Smoke test through the proxy
        run: node infrastructure/smoke/smoke.mjs http://127.0.0.1:8080
      - name: Secret isolation (each service holds only its own settings)
        run: bash infrastructure/local/check-isolation.sh
      - name: Service logs
        if: failure()
        run: docker compose -f infrastructure/local/compose.yml logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/local/compose.yml down -v
