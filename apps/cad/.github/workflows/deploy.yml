# Deploys BIZOMAT CAD Automation (the server in opensketch/; called CADOS by KEVOS until November 2026) to Fly.io from main, only after the tests pass (tests.yml, called below).
#
# Repository secrets (Settings > Secrets and variables > Actions):
# - FLY_API_TOKEN: a deploy token for this app only: `fly tokens create deploy -a <app>` (or the Fly dashboard:
#   the app > Tokens). Until it is set nothing is deployed. Only the steps that run flyctl see it.
# - GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET (optional), OPENSKETCH_ACCESS_CODE (optional early access code): passed
#   to Fly as the app's secrets. There is no server password: a server with no account answers only its setup page
#   (auth.py, setup mode) until the first person creates the owner account.
# A new app needs the app and its volume once: `fly apps create <app>` and
# `fly volumes create opensketch_data -a <app> -r syd -s 1` (with an org token this workflow still makes them).
#
# Pushes: the Fly app (cados) is linked to this repository and Fly deploys every push to main itself, so a push runs
# only the tests here, unless the repository variable DEPLOY_ON_PUSH is "true" (then unlink the repo in Fly).
# Run by hand, it deploys from here (and makes the volume if it is missing).
#
# What deploys: a push to main whose changes since the live version (the site's /healthz names its commit) touch
# more than notes and tests (root *.md, docs/, tests/, solidworks/tests/): each deploy restarts the one server
# (~15 s offline). Afterwards the live /healthz must answer with the new version within 3 minutes, else the run fails.
# Run by hand (Actions > Deploy to Fly.io > Run workflow) to redeploy; "skip tests" only to bring a stuck site back.
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Deploy without running the tests first (only to bring a stuck site back quickly)
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP: ${{ vars.FLY_APP || 'cados' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.plan.outputs.test }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: What changed
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          not_tested='^docs/|^[^/]+\.md$|^$'
          not_deployed='^(docs|tests|solidworks/tests)/|^[^/]+\.md$|^$'
          changed() {  # files changed from commit $1 to this one; one placeholder line when $1 is unknown
            if [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; then
              git diff --name-only "$1" "$GITHUB_SHA"
            else
              echo "(everything: no known base commit)"
            fi
          }
          live=$(curl -fsS --max-time 30 "https://$APP.fly.dev/healthz" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
          if [ "$EVENT" = "workflow_dispatch" ]; then
            deploy=true
            if [ "$SKIP_TESTS" = "true" ]; then test=false; else test=true; fi
          else
            deploy=false; test=false
            since_live=$(changed "$live")
            since_before=$(changed "$BEFORE")
            grep -Eqv "$not_deployed" <<<"$since_live" && deploy=true
            grep -Eqv "$not_tested" <<<"$since_before" && test=true
            [ "$deploy" = true ] && test=true  # nothing goes live untested
          fi
          echo "test=$test" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Live version: ${live:-unknown}. Run the tests: $test. Deploy ${GITHUB_SHA::7}: $deploy." | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    needs: plan
    if: needs.plan.outputs.test == 'true'
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: [plan, test]
    # a push deploys only after its tests passed; a manual run may skip them
    if: >-
      !cancelled() && needs.plan.outputs.deploy == 'true' &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-fly
      cancel-in-progress: false
    env:
      ORG: ${{ vars.FLY_ORG || 'personal' }}
      REGION: syd
      # The public address (OAuth metadata, pairing and download links). The health checks below use <app>.fly.dev, the
      # origin that always answers. Set the repository variable PUBLIC_URL to override it.
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://bizomat.ai/cad' }}
    steps:
      - name: Check setup
        id: setup
        env:
          HAS_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
          EVENT: ${{ github.event_name }}
          DEPLOY_ON_PUSH: ${{ vars.DEPLOY_ON_PUSH }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "No FLY_API_TOKEN secret yet: not deploying."
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ] && [ "$DEPLOY_ON_PUSH" != "true" ]; then
            # the Fly app is linked to this repository and deploys each push itself; deploying here too would race it
            echo "Fly deploys pushes itself (repository variable DEPLOY_ON_PUSH is not true): tests only." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ] && tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) \
               && [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            # tests of two pushes can finish in either order: never put an older commit over a newer one
            echo "main has moved on to ${tip::7}; its own run deploys it." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.setup.outputs.go == 'yes'
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        if: steps.setup.outputs.go == 'yes'

      - name: Create the app and its volume (first run only)
        if: steps.setup.outputs.go == 'yes'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! flyctl status --app "$APP" >/dev/null 2>&1; then
            flyctl apps create "$APP" --org "$ORG"
          fi
          if [ "$(flyctl volumes list --app "$APP" --json | jq 'map(select(.name == "opensketch_data")) | length')" = "0" ]; then
            flyctl volumes create opensketch_data --app "$APP" --region "$REGION" --size 1 --yes
          fi
          # without public addresses <app>.fly.dev does not exist in DNS (an app made outside flyctl can have none)
          if [ "$(flyctl ips list --app "$APP" --json | jq 'length')" = "0" ]; then
            flyctl ips allocate-v6 --app "$APP"
            flyctl ips allocate-v4 --shared --app "$APP"
          fi

      - name: Pass secrets to Fly
        if: steps.setup.outputs.go == 'yes'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          OPENSKETCH_ACCESS_CODE: ${{ secrets.OPENSKETCH_ACCESS_CODE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          args=()
          if [ -n "$OPENSKETCH_ACCESS_CODE" ]; then args+=("OPENSKETCH_ACCESS_CODE=$OPENSKETCH_ACCESS_CODE"); fi
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            args+=("GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET")
          fi
          if [ "${#args[@]}" -gt 0 ]; then flyctl secrets set --app "$APP" --stage "${args[@]}"; else echo "No optional secrets to pass."; fi

      - name: Deploy
        if: steps.setup.outputs.go == 'yes'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --app "$APP" --remote-only --ha=false \
            --build-arg OPENSKETCH_VERSION="${GITHUB_SHA::7}" \
            --env OPENSKETCH_PUBLIC_URL="${PUBLIC_URL:-https://$APP.fly.dev}"

      # flyctl reports success once the machine runs, even when the server inside never answers (the supervisor keeps
      # the machine alive for a while): ask the site itself which version it serves
      - name: Check the live site
        if: steps.setup.outputs.go == 'yes'
        run: |
          want="${GITHUB_SHA::7}"
          for _ in $(seq 1 36); do
            got=$(curl -fsS --max-time 10 "https://$APP.fly.dev/healthz" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$got" = "$want" ]; then
              echo "CAD Automation $want is live at ${PUBLIC_URL:-https://$APP.fly.dev}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$APP.fly.dev/healthz did not answer with version $want within 3 minutes (last answer: ${got:-none}). See 'flyctl logs -a $APP'. To go back: 'flyctl releases -a $APP --image', then 'flyctl deploy -a $APP --image <the previous image>'."
          exit 1
