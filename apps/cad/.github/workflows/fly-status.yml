# Reads the Fly app's state, so it can be checked from GitHub (Actions > Fly status > Run workflow): the app, its
# machines, volumes, secret names (never values), releases, recent logs, what /healthz answers and, last, whether a
# repository is connected to the app in Fly as its deployment source (.github/scripts/fly-deploy-source.sh). The run
# fails when Fly reports one, or when that cannot be read: Fly would then build and deploy pushes itself, around
# deploy.yml (disconnected by the owner on 16 Nov 2026). Changes nothing, disconnects nothing and deploys nothing.
# Needs the repository secret FLY_CADOS_TOKEN (Fly: the app > Tokens > a deploy token).
name: Fly status

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP: cados  # this repository deploys and inspects only the cados app

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check setup
        env:
          HAS_TOKEN: ${{ secrets.FLY_CADOS_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the repository secret FLY_CADOS_TOKEN (Fly: the app > Tokens > Create deploy token)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: App, machines, volumes, secrets, releases
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
        run: |
          set +e
          for cmd in "status" "machines list" "volumes list" "secrets list" "releases" "certs list" "ips list"; do
            echo "::group::flyctl $cmd"
            flyctl $cmd --app "$APP"; rc=$?
            echo "::endgroup::"
            echo "=== flyctl $cmd: exit $rc ==="
          done
          true

      # Where "Download for SOLIDWORKS" (/download/solidworks) sends people: an installer the operator put on the volume,
      # else the published release record's msi_url (opensketch/server.py, installer_url). Names, sizes and the record
      # only: it holds a version, an address and a checksum, nothing secret.
      - name: Installer and release record on the volume (read only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
        run: |
          flyctl ssh console --app "$APP" -C "sh -c 'echo === /data/downloads; ls -la /data/downloads 2>&1; sha256sum /data/downloads/*.msi 2>&1; echo === /data/bridge-release.json; head -c 2000 /data/bridge-release.json 2>&1; echo; echo === OPENSKETCH_INSTALLER_URL; printenv OPENSKETCH_INSTALLER_URL || echo not set'" || true

      - name: Recent logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
        run: flyctl logs --app "$APP" --no-tail | tail -n 300 || true

      - name: What the site answers
        run: |
          for path in /healthz /; do
            echo "=== https://$APP.fly.dev$path"
            curl -sS --max-time 60 -o /tmp/body -w "HTTP %{http_code} in %{time_total}s\n" "https://$APP.fly.dev$path" || true
            head -c 600 /tmp/body 2>/dev/null; echo
          done

      # Last, so a connected repository fails the run after everything above has been read. One read-only query; the
      # token reaches curl on standard input; only plain fields are printed (never the raw answer).
      - name: Is a repository connected to cados in Fly? (read only; fails if one is)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
        run: bash .github/scripts/fly-deploy-source.sh
