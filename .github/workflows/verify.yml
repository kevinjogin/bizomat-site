name: Verify KEVOS site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment); Dependabot proposes updates.
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Check, test and build site
        run: npm run verify
      - name: Check approved KEVOS branding in the compiled homepage
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'KEVOS' dist/index.html
          grep -q 'kevos-wordmark-orange-light.svg' dist/index.html
          grep -q 'Explore WORKOS' dist/index.html
          grep -q 'Explore READOS' dist/index.html
          if grep -qi '<title>GoCore\|GoCore Assistant\|GoCore Factory Fix' dist/index.html; then
            echo "::error::Old GoCore branding found in the compiled KEVOS homepage"
            exit 1
          fi
          test -s dist/brand/kevos-favicon-k-orange-192.png
          test -s dist/brand/kevos-favicon-k-orange-512.png

  # Production dependencies only: the Worker and the shipped site. Build tools are reviewed through Dependabot.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
