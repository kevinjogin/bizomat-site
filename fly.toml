# Fly.io app "cados" (public address https://cados.kevos.com, origin https://cados.fly.dev): CADOS by KEVOS in Sydney on one dedicated CPU core with 2 GB, suspended
# when idle (woken by the next request). A dedicated core because on shared CPU, heavy CAD work uses up the burst
# allowance. Billed only while it runs; a linked add-in's long poll keeps it awake. Inside, `--supervise`
# (Dockerfile) restarts the server when it stops answering.
# Deployed by Fly itself: the app is linked to this repository and builds every push to main. Keep the
# OPENSKETCH_PASSWORD secret set on the app (without it the public site is open). GitHub Actions deploys only when
# run by hand (deploy.yml), and fly-status.yml reads the app's state and logs.
# Settings: https://fly.io/docs/reference/configuration/

app = 'cados'
primary_region = 'syd'
kill_timeout = '15s'

[build]
  dockerfile = 'Dockerfile'

[env]
  OPENSKETCH_DATA = '/data'
  # The public address (OAuth metadata, links, canonical tags); browsers on the old host are sent there with a 301
  # (opensketch/canonical.py; health checks, MCP, OAuth, /api/ and the device API are not redirected).
  OPENSKETCH_PUBLIC_URL = 'https://cados.kevos.com'
  OPENSKETCH_REDIRECT_HOSTS = 'cados.fly.dev'

[[mounts]]
  source = 'opensketch_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 1000
    soft_limit = 200

[[vm]]
  size = 'performance-1x'
  memory = '2gb'
