# fly.toml app configuration file generated for cados on 2026-11-04T00:03:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cados'
primary_region = 'syd'
kill_timeout = '15s'

[build]
  dockerfile = 'Dockerfile'

[env]
  OPENSKETCH_DATA = '/data'

[[mounts]]
  source = 'opensketch_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 1000
    soft_limit = 200

[[vm]]
  size = 'performance-1x'
  memory = '2gb'
