# BIZOMAT platform CI: the website, both apps, the edge proxy, the platform image and the local stack.
# Runs on pull requests and on main after a merge. Read-only: no secrets, nothing deployed, nothing pushed.
#
# Jobs: website (brand copies, verify), work (lint, types, tests, builds incl. the Node server), cad (pytest in two
# parts, npm test), proxy (tests, script and config checks), image (Docker build of infrastructure/fly/Dockerfile,
# a migration round trip inside it, then the compose stack with the smoke test and the secret-isolation check).
name: BIZOMAT CI

# Pull requests run it, and main runs it after a merge. A push to a branch with an open pull request used to run every
# job twice (once for the push, once for the pull request), which doubled the Actions minutes (owner, 14 Nov 2026:
# "reduce my bills"). A branch without a pull request can still run it by hand (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bizomat-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment); Dependabot proposes updates.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      # before the build: the build rewrites any copy that is out of step, which would hide it
      - name: Brand copies in step across the website and both apps
        run: node shared/brand/build.mjs --check
      - name: Check, test and build the site
        run: npm run verify
      - name: Build the website's Node server (the Fly web process)
        run: npm run build:server

  work:
    name: work
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/work
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/work/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:node
      - run: npm run build:node

  cad:
    name: cad pytest (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/cad
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: main
            select: not slow
          - part: worker processes
            select: slow
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/cad/requirements-dev.txt
      # node runs the sketch solver (opensketch/solver)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # .NET runs the C# Companion and add-in link in the slow end-to-end test
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: matrix.part == 'worker processes'
        with:
          dotnet-version: "8.0.x"
      - name: Libraries OpenCascade needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgl1 libglu1-mesa libxrender1 libxext6 libx11-6
      - name: Python packages (exact versions)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: pytest
        env:
          SELECT: ${{ matrix.select }}
        run: python -m pytest -q -ra --timeout=900 -m "$SELECT"

  cad-npm:
    name: cad npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cad
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/cad/package-lock.json
      - run: npm ci
      - run: npm test

  proxy:
    name: proxy and platform files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Proxy tests (routing, headers, streaming, WebSockets, a 25 s long poll)
        run: node --test 'infrastructure/proxy/test/*.test.mjs'
      - name: Scripts parse
        run: |
          node --check infrastructure/smoke/smoke.mjs
          node --check infrastructure/local/stub-upstream.mjs
          python3 -m py_compile infrastructure/migrate/lib/*.py infrastructure/migrate/work/*.py infrastructure/fly/*.py infrastructure/fly/test/*.py
          node --check scripts/sync-cad.mjs
          node --check infrastructure/migrate/cad/to-fly.mjs
          node --check infrastructure/migrate/test/cad-move/fake-fly.mjs
          python3 -m py_compile infrastructure/migrate/test/cad-move/cad-standin.py
      - name: Shell scripts (shellcheck)
        run: shellcheck infrastructure/fly/entrypoint.sh infrastructure/fly/test/*.sh infrastructure/migrate/*.sh infrastructure/migrate/*/*.sh infrastructure/migrate/test/cad-move/*.sh infrastructure/local/*.sh
      # The whole CAD Automation move (bizomat.ps1 move cad) against a stand-in flyctl: each Machine in its own
      # namespaces with its own /data and /tmp, the real entrypoint, holding page, export, import and router; the way
      # back, a failure in the middle, the fallback ways of carrying the copy, the retirement. Root for the namespaces.
      - name: CAD move rehearsal (infrastructure/migrate/test/cad-move/rehearse.sh)
        run: sudo env "PATH=$PATH" bash infrastructure/migrate/test/cad-move/rehearse.sh
      - name: fly.toml and fly.website.toml (groups, the one public service, a volume each for work and cad, the CAD route)
        run: python3 infrastructure/fly/test/check-config.py fly.toml fly.website.toml
      # apps/cad's tree hash must equal the pinned tree. The pinned commit's own tree can only be checked against the
      # private repository kevinjogin/bizomat-cad with a token that can read it (--github), so CI checks the tree here.
      - name: apps/cad is exactly the pinned CAD commit (apps/cad-source.json)
        run: node scripts/sync-cad.mjs check
      - name: The compose files read
        run: |
          docker compose -f infrastructure/local/compose.yml config -q
          docker compose -f infrastructure/local/compose.yml -f infrastructure/local/compose.stubs.yml config -q

  image:
    name: image and local stack
    needs: proxy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIZOMAT_IMAGE: bizomat:ci
      COMPOSE_PROJECT_NAME: bizomat-ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Make room on the runner (the image builds the website, the .NET add-in and OpenCascade)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build the platform image (all four roles; nothing is pushed)
        run: docker build -f infrastructure/fly/Dockerfile -t "$BIZOMAT_IMAGE" --build-arg BIZOMAT_VERSION="${GITHUB_SHA::7}" .
      - name: Image size
        run: docker image ls "$BIZOMAT_IMAGE" --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Entrypoint (secret isolation per role, volumes, secret files, maintenance mode, refusals)
        run: bash infrastructure/fly/test/entrypoint.test.sh "$BIZOMAT_IMAGE"
      - name: Migration round trip in the image (export, restore, verify)
        run: docker run --rm --network none -v "$PWD/infrastructure/migrate/test:/t:ro" "$BIZOMAT_IMAGE" bash /t/roundtrip.sh
      - name: Start the local stack (the same image)
        run: docker compose -f infrastructure/local/compose.yml up -d --wait --wait-timeout 300 --no-build
      - name: Smoke test through the proxy
        run: node infrastructure/smoke/smoke.mjs http://127.0.0.1:8080
      - name: Secret isolation (each service holds only its own settings)
        run: bash infrastructure/local/check-isolation.sh
      - name: Service logs
        if: failure()
        run: docker compose -f infrastructure/local/compose.yml logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/local/compose.yml down -v
