# Pages CMS (https://app.pagescms.org): the online editor for gocore.com.au.
# Sign in with GitHub, open this repository, and edit content in forms. Every save is a Git
# commit to `main`, and Cloudflare rebuilds and redeploys the site automatically.
#
# Keep the category and tag lists below in sync with src/config/taxonomy.ts.

media:
  - name: insight_images
    label: Insight images
    input: src/content/insights/images
    output: ./images
    categories: [image]
    rename: safe
  - name: work_images
    label: Work images
    input: src/content/work/images
    output: ./images
    categories: [image]
    rename: safe

content:
  - name: insights
    label: Insights
    type: collection
    path: src/content/insights
    format: yaml-frontmatter
    exclude: [images]
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, category, draft, publishDate]
      primary: title
      sort: [publishDate, title]
      search: [title, description]
      default:
        sort: publishDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "Aim for 50–60 characters. The file name (and permanent web address) is created from the title when you first save."
        options: { minlength: 5, maxlength: 120 }
      - name: description
        label: Description
        type: text
        required: true
        description: "One or two sentences (50–200 characters). Shown on article cards and in Google results."
        options: { minlength: 50, maxlength: 200 }
      - name: draft
        label: Draft (hidden from the website)
        type: boolean
        default: false
        description: "Tick to hide the article while you are still working on it. Unticked articles go live within a few minutes of saving."
      - name: publishDate
        label: Publish date
        type: date
        required: true
        description: "Future dates stay hidden until a rebuild on or after that date."
        options: { format: yyyy-MM-dd }
      - name: updatedDate
        label: Updated date
        type: date
        default: ""
        description: "Optional. Set when an article is meaningfully revised."
        options: { format: yyyy-MM-dd }
      - name: category
        label: Category
        type: select
        required: true
        description: "Exactly one."
        options:
          values: [Ideas, Products, Technology, Business]
      - name: tags
        label: Tags
        type: select
        required: true
        description: "Choose 2 to 5 from the controlled list."
        options:
          multiple: true
          min: 1
          max: 5
          values:
            - { name: product-development, label: Product development }
            - { name: manufacturing, label: Manufacturing }
            - { name: prototyping, label: Prototyping }
            - { name: design, label: Design }
            - { name: automation, label: Automation }
            - { name: ai, label: AI }
            - { name: systems, label: Systems }
            - { name: operations, label: Operations }
            - { name: strategy, label: Strategy }
            - { name: experimentation, label: Experimentation }
            - { name: customers, label: Customers }
            - { name: validation, label: Validation }
            - { name: process-improvement, label: Process improvement }
            - { name: finance, label: Finance }
            - { name: sales, label: Sales }
      - name: featured
        label: Featured on the Insights page
        type: boolean
        default: false
      - name: author
        label: Author
        type: string
        default: GoCore
      - name: image
        label: Cover image (optional)
        type: image
        description: "JPG or PNG, at least 2000 px wide. Optimised automatically."
        options: { media: insight_images }
      - name: imageAlt
        label: Cover image description (alt text)
        type: string
        description: "Required if you add a cover image. Describe what the image shows."
      - name: canonicalURL
        label: Original URL (optional)
        type: string
        description: "Only for articles first published elsewhere."
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown
          media: insight_images

  - name: work
    label: Work
    type: collection
    path: src/content/work
    format: yaml-frontmatter
    exclude: [images]
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, type, status, draft]
      primary: title
      sort: [order, title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options: { minlength: 2, maxlength: 100 }
      - name: summary
        label: Summary
        type: text
        required: true
        options: { minlength: 20, maxlength: 260 }
      - name: type
        label: Type
        type: select
        required: true
        options:
          values: [Project, Product, Experiment, Research, Concept]
      - name: status
        label: Status
        type: select
        required: true
        options:
          values: [Exploring, Developing, Testing, Released, Completed, Archived]
      - name: date
        label: Date
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - name: draft
        label: Draft (hidden from the website)
        type: boolean
        default: false
      - name: featured
        label: Show in "Selected work" on the homepage
        type: boolean
        default: false
      - name: order
        label: Display order (lower first)
        type: number
        default: 100
      - name: image
        label: Featured image (optional)
        type: image
        options: { media: work_images }
      - name: imageAlt
        label: Featured image description (alt text)
        type: string
      - name: gallery
        label: Gallery (optional)
        type: object
        list: true
        fields:
          - name: src
            label: Image
            type: image
            required: true
            options: { media: work_images }
          - name: alt
            label: Description (alt text)
            type: string
            required: true
          - name: caption
            label: Caption
            type: string
      - name: relatedInsights
        label: Related Insights (file names without .md)
        type: string
        list: true
        description: "e.g. why-this-website-has-no-database"
      - name: externalUrl
        label: External link (optional)
        type: string
      - name: body
        label: Detail page (leave empty for a card without a detail page)
        type: rich-text
        options:
          format: markdown
          media: work_images

  - name: faq
    label: Assistant FAQ
    type: file
    path: src/data/faq.json
    format: json
    list: true
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: text
        required: true
        description: "The website assistant treats these answers as its most trusted source. Keep them accurate."
