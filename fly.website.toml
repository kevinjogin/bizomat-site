# BIZOMAT on Fly.io: the website, the router behind bizomat.ai and Project Management, in the Fly app `bizomat` (syd).
# CAD Automation is its own Fly app, `cados` (repository kevinjogin/bizomat-cad), reached over Fly's private network.
#
# One Machine (owner, 10 Nov 2026, to cut cost): the Machine of the group `work`, which holds the volume work_data,
# runs the router, the website and Project Management together (`bizomat-entrypoint all`: each service as its own user
# with its own settings; infrastructure/fly/entrypoint.sh). The group keeps the name work so that the Machine and its
# volume stay where they are. shared-cpu-1x with 1 GB to start; measured needs and the step down to 768 or 512 MB:
# docs/BIZOMAT-DEPLOYMENT.md, section 6e. Until that section's cutover has run, production still has the three
# Machines of 9 Nov 2026 (proxy 256 MB, web 512 MB, work 512 MB, all shared-cpu-1x in syd): deploy nothing else from
# this file before it (`bizomat.ps1 deploy website` runs no preflight, and flyctl would destroy proxy and web before
# work takes over). The three-Machine file, for the way back: `git show 738e48b:fly.website.toml`.
# The `cad` group of the earlier plan (CAD inside this app) never ran and is not here; fly.toml still describes that
# plan and is not deployed.
#
#   bizomat.ai/...       -> web    the BIZOMAT website (this app)
#   bizomat.ai/cad/...   -> the Fly app `cados` at http://cados.internal:8080 (UPSTREAM_CAD below), with CAD's root
#                           program paths (CAD_PATHS in infrastructure/proxy/routes.mjs; docs/SITE-CAD-INTEGRATION.md)
#   bizomat.ai/tasks/... -> work   Project Management, in this app with its data on the volume work_data (moved from
#                                  Cloudflare on 6 Nov 2026: docs/BIZOMAT-DEPLOYMENT.md, section 6c)
#   bizomat.ai/login     -> 301    /sign-in/, the website's page that offers each application's sign-in
#   bizomat.fly.dev/...  -> 301    the same path on bizomat.ai (the app's own address is not a second address of the
#                                  platform; /__proxy/health and /__proxy/ready stay, for checks)
#   (the router, web and work are processes of the one Machine; the router reaches the other two on 127.0.0.1)
#
# Deployed only by hand from GitHub Actions (.github/workflows/bizomat-deploy.yml), which runs
#   flyctl deploy --config fly.website.toml --app bizomat --remote-only --ha=false --build-arg BIZOMAT_VERSION=<commit>
# after its preflight (.github/scripts/fly-preflight.py) has checked that the deploy keeps these Machines as they are.
# --ha=false keeps one Machine: work must never have two (each would get its own empty volume).

app = "bizomat"
primary_region = "syd"
kill_signal = "SIGTERM"
# all stops the router first (its open requests get 10 s, PROXY_SHUTDOWN_GRACE_MS, and 2 s more), then the website and
# Project Management (12 s): 30 s leaves room for both before Fly kills what is left.
kill_timeout = 30

[build]
  dockerfile = "infrastructure/fly/Dockerfile"
  ignorefile = ".dockerignore"

[deploy]
  # rolling is the only strategy for Machines with volumes. With one Machine, bizomat.ai is offline while it restarts
  # on a deploy (about 10-60 s: Fly answers with an error page); open boards and CAD long polls reconnect. CAD's own
  # app (cados) keeps running, but bizomat.ai/cad goes through this router, so it pauses too.
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "10m"

[processes]
  # the router (:8080, public), the website (:8003) and Project Management (:8002) on this one Machine
  work = "/usr/local/bin/bizomat-entrypoint all"

[env]
  # On the same Machine (the entrypoint's all fixes these two to the same values whatever is set here).
  UPSTREAM_WEB = "http://127.0.0.1:8003"
  UPSTREAM_WORK = "http://127.0.0.1:8002"
  # Where bizomat.ai/cad goes: the Fly app cados (repository kevinjogin/bizomat-cad), over the private network; it
  # listens on :: port 8080. Both apps must stay in the same Fly organization (docs/SITE-CAD-INTEGRATION.md).
  UPSTREAM_CAD = "http://cados.internal:8080"
  # bizomat.ai/tasks/... reaches work (no TASKS_REDIRECT_ORIGIN since the switch, 6 Nov 2026). To send it back to the old
  # address for a while: TASKS_REDIRECT_ORIGIN = "https://work.kevos.com" (302, prefix off).
  # Off outside a cutover: bizomat.fly.dev then answers 301 to bizomat.ai. "1" turns on the preview switch
  # (https://bizomat.fly.dev/__preview/{web,work,cad}) for checking a backend before it goes live.
  BIZOMAT_PREVIEW_ROUTING = "0"
  # work: passed to the work role as APP_URL, APP_NAME, ENVIRONMENT, ALLOW_SIGNUP and SESSION_TTL_HOURS
  # (infrastructure/fly/entrypoint.sh). Sign-up and session length as work.kevos.com runs today: open sign-up, 72 h.
  # It signs people in with email and password only; Google sign-in is off on work.kevos.com, so no secret is needed.
  WORK_APP_URL = "https://bizomat.ai/tasks"
  WORK_APP_NAME = "BIZOMAT Project Management"
  WORK_ENVIRONMENT = "production"
  WORK_ALLOW_SIGNUP = "true"
  WORK_SESSION_TTL_HOURS = "72"
  # Its address: a page asked for on another host (work.kevos.com once it points here, bizomat.fly.dev) answers 301 to
  # the same path under it; /api/ and the files keep answering there for open tabs.
  WORK_CANONICAL_URL = "https://bizomat.ai/tasks"
  # CAD Automation's address, the same as the cados app's fly.toml. The entrypoint passes OPENSKETCH_* to a cad role
  # only, and this app runs none since 9 Nov 2026, so these two have no effect here; they stay so that the Machines'
  # settings are unchanged and infrastructure/fly/test/check-config.py keeps checking the address.
  OPENSKETCH_PUBLIC_URL = "https://bizomat.ai/cad"
  OPENSKETCH_REDIRECT_HOSTS = "cados.fly.dev,cados.kevos.com,cad.bizomat.ai"

[http_service]
  processes = ["work"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 800
    hard_limit = 1500
  [http_service.http_options]
    idle_timeout = 600

# All three on the one Machine: the router, the website and Project Management each answer their own health path.
[checks]
  [checks.proxy]
    processes = ["work"]
    type = "http"
    port = 8080
    method = "get"
    path = "/__proxy/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
  [checks.web]
    processes = ["work"]
    type = "http"
    port = 8003
    method = "get"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
  [checks.work]
    processes = ["work"]
    type = "http"
    port = 8002
    method = "get"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# Project Management's data: one volume on its one Machine (created by the first deploy), snapshotted daily and kept
# 30 days. The data move puts db.sqlite and files/ in /data/work (infrastructure/migrate/work).
[[mounts]]
  source = "work_data"
  destination = "/data"
  processes = ["work"]
  initial_size = "3gb"
  snapshot_retention = 30
  scheduled_snapshots = true
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "20GB"

# 1 GB to start (owner, 10 Nov 2026); the three services together used about 85 MB idle and at most about 320 MB under
# a heavy local load test (docs/BIZOMAT-DEPLOYMENT.md, section 6e). Read production's use before going to 768 or 512 MB.
[[vm]]
  processes = ["work"]
  size = "shared-cpu-1x"
  memory = "1gb"

# Restart the Machine whenever its process exits: all exits when any of the three services exits, so a crash restarts
# all three (the entrypoint exits non-zero on a missing volume: the loop then shows in fly logs until it is fixed; in
# maintenance mode work sleeps, the router and the website stay up, for a data move).
[[restart]]
  policy = "always"
  processes = ["work"]

