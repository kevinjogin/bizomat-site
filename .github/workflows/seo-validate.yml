# KEVOS AutoSEO: release gate on every change, and IndexNow after deployment. See seo/AUTOMATION-RUNBOOK.md.
# Read-only token. The gate blocks a release that would harm indexing; IndexNow runs only for pushes to main.
name: SEO validate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: kevos-autoseo-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Build the site
        run: npm run build
      - name: SEO gate (sitemap, canonicals, indexability, robots.txt, structured data)
        run: node scripts/seo/validate.mjs
      - name: URL inventory and page manifest
        run: |
          node scripts/seo/inventory.mjs
          node scripts/seo/run.mjs manifest
          cp seo/url-inventory.json .seo-build/
      - name: Keep the inventory and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seo-build-${{ github.run_id }}
          path: .seo-build/
          retention-days: 30
          # .seo-build/ is a dot-directory: upload-artifact v4.4+ skips hidden paths by default and would
          # upload nothing, so the indexnow job could not download the manifest. Fail loudly if it is empty.
          include-hidden-files: true
          if-no-files-found: error

  # After a push to main: tell IndexNow about canonical pages whose content changed, once production serves
  # the new build. Shares the AutoSEO lock with the scheduled jobs. The first run records a baseline only.
  indexnow:
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: kevos-autoseo
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fetch the gate's manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: seo-build-${{ github.run_id }}
          path: .seo-build/
      - name: Restore AutoSEO history
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .seo-data
          key: seo-data-${{ github.run_id }}
          restore-keys: seo-data-
      - name: Submit changed URLs to IndexNow
        run: node scripts/seo/run.mjs indexnow
