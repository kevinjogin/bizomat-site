# Fly.io: OpenSketch in Sydney on one dedicated CPU core with 2 GB, stopped when idle (woken by the next request,
# a few seconds). performance-1x since 2026-10-19: on shared-cpu-2x a big rebuild or a server-drawn picture used up
# the burst allowance and the machine dropped to ~6% of a core, so the site froze for 10+ minutes. Billed only while
# it runs (about US$0.06 an hour in Sydney). Inside, `--supervise` (Dockerfile) restarts the server when it stops
# answering, since Fly only restarts a machine whose process exits.
# Deployed by .github/workflows/deploy.yml on every push to main once FLY_API_TOKEN is set in the repo's
# secrets; the app name can be changed with the repository variable FLY_APP (it must be unique on Fly).

app = "opensketch-yz"
primary_region = "syd"
# the supervisor gives the server 8 s to finish open requests before killing it; Fly waits this long for both
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

[env]
  OPENSKETCH_DATA = "/data"
  # early access for showcases: people who type this code skip sign-up and use the server's AI key (accounts.py).
  # The owner can change it or turn it off in People on this server, which overrides this.
  OPENSKETCH_ACCESS_CODE = "access20"

[http_service]
  internal_port = 8080
  force_https = true
  # suspend, not stop: an idle machine is frozen with its memory and wakes in a few hundred ms with its caches
  # (a stopped one boots in ~10 s and rebuilds every model from scratch). Needs 2 GB or less and no swap. The
  # supervisor tells a pause from a hang (supervisor.py). A deploy still starts it cold.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "performance-1x"
  memory = "2gb"

# the documents (and their versions); one machine, since a volume belongs to one machine
[mounts]
  source = "opensketch_data"
  destination = "/data"
