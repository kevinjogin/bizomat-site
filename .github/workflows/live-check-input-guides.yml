# Temporary diagnostic: opens WORKOS tools on the live kevos.com in WebKit (Safari's engine). Removed after use.
name: Live check (WebKit tools)
on:
  push:
    branches: [claude/loving-mccarthy-oubwh2]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install WebKit
        run: npm i --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps webkit chromium
      - name: Open tools in WebKit and Chromium
        shell: bash
        run: |
          cat > check.mjs <<'JS'
          import { webkit, chromium, devices } from 'playwright';
          const note = (t, m) => console.log(`::notice title=${t}::${String(m).replace(/\n/g, ' ⏎ ').slice(0, 1800)}`);
          const state = (p) => p.evaluate(() => ({
            url: location.pathname + location.search,
            workspace: document.querySelector('#tool-workspace') ? !document.querySelector('#tool-workspace').hidden : 'none',
            tool: document.querySelector('#tool-name')?.textContent,
            directory: document.querySelector('#tool-directory') ? !document.querySelector('#tool-directory').hidden : 'none',
            inputs: document.querySelectorAll('#tool-form [name]').length,
            scripts: { tools: (window.GOCORE_TOOLS || []).length, guides: Object.keys(window.WORKOS_GUIDES || {}).length, inputs: Object.keys(window.WORKOS_INPUTS || {}).length, ig: typeof window.WORKOS_INPUT_GUIDE, ui: typeof window.WORKOS_UI, calc: typeof window.calc },
          }));
          for (const [engine, type, dev] of [['webkit-iphone', webkit, devices['iPhone 13']], ['webkit-desktop', webkit, devices['Desktop Safari']], ['chromium-iphone', chromium, devices['iPhone 13']]]) {
            const b = await type.launch();
            const ctx = await b.newContext(dev);
            const p = await ctx.newPage();
            const errs = [];
            p.on('console', (m) => m.type() === 'error' && errs.push(`console: ${m.text()}`));
            p.on('pageerror', (e) => errs.push(`pageerror: ${e.message} @ ${(e.stack || '').split('\n').slice(0, 3).join(' | ')}`));
            p.on('requestfailed', (r) => errs.push(`requestfailed: ${r.url()} ${r.failure()?.errorText}`));
            // 1. The static page, then the button.
            await p.goto('https://kevos.com/tools/axial-stress/', { waitUntil: 'load' });
            const btn = p.locator('a.btn', { hasText: 'Open the calculator' }).first();
            note(`${engine} button`, await btn.getAttribute('href'));
            await btn.click();
            await p.waitForLoadState('load');
            await p.waitForTimeout(3000);
            note(`${engine} after button`, JSON.stringify(await state(p)));
            // 2. Direct links.
            for (const id of ['axial-stress', 'roi', 'extension-spring', 'turning-power']) {
              await p.goto(`https://kevos.com/tools/?tool=${id}`, { waitUntil: 'load' });
              await p.waitForTimeout(2500);
              note(`${engine} direct ${id}`, JSON.stringify(await state(p)));
            }
            note(`${engine} errors`, errs.length ? errs.slice(0, 8).join(' || ') : 'none');
            await b.close();
          }
          JS
          node check.mjs
