<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="one-account-title one-account-desc" class="lv">
  <title id="one-account-title">One BIZOMAT account opens everything</title>
  <desc id="one-account-desc">You sign in once with your BIZOMAT account at bizomat.ai/erp. BIZOMAT ERP opens with every module for each company you work in. CAD Automation takes the same account through Continue with BIZOMAT, and an AI app you connect signs in through your account too.</desc>
  <defs><marker id="oa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="lv-arrowhead"/></marker></defs>
  <rect x="20" y="104" width="190" height="92" rx="14" class="lv-core"/>
  <text x="115" y="144" class="lv-core-title" text-anchor="middle">Your BIZOMAT</text>
  <text x="115" y="168" class="lv-core-title" text-anchor="middle">account</text>
  <g class="lv-flows"><path d="M212 136 L330 70" marker-end="url(#oa-arrow)"/><path d="M212 150 L330 150" marker-end="url(#oa-arrow)"/><path d="M212 164 L330 232" marker-end="url(#oa-arrow)"/></g>
  <rect x="336" y="30" width="500" height="76" rx="12" class="lv-box"/><text x="356" y="60" class="lv-head">BIZOMAT ERP · bizomat.ai/erp</text><text x="356" y="86" class="lv-small">every module, for each company you work in</text>
  <rect x="336" y="116" width="500" height="68" rx="12" class="lv-box"/><text x="356" y="144" class="lv-head">CAD Automation · bizomat.ai/cad</text><text x="356" y="168" class="lv-small">choose Continue with BIZOMAT: the same account</text>
  <rect x="336" y="194" width="500" height="76" rx="12" class="lv-box"/><text x="356" y="224" class="lv-head">Your AI app (Claude, ChatGPT)</text><text x="356" y="250" class="lv-small">connects to CAD Automation and signs in with your account</text>
</svg>
