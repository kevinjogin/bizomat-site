# Runs the test suite: pytest on Python 3.12 with the pinned requirements-dev.txt (the versions the server image
# installs) and npm test on Node 20. On pull requests and on pushes to branches other than main; pushes to main are
# tested by deploy.yml, which calls this workflow and deploys only when every job here passes.
# The end-to-end worker tests (`@pytest.mark.slow`: real servers and worker processes, timing checks) run in a job
# of their own, so they have the runner to themselves.
name: Tests

on:
  pull_request:
    paths-ignore: ["docs/**", "*.md"]
  push:
    branches-ignore: [main]
    paths-ignore: ["docs/**", "*.md"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: main
            select: not slow
          - part: worker processes
            select: slow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # node runs the sketch solver (opensketch/solver)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Libraries OpenCascade needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgl1 libglu1-mesa libxrender1 libxext6 libx11-6
      - name: Python packages (exact versions)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q -ra --timeout=900 -m "${{ matrix.select }}"

  npm:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
