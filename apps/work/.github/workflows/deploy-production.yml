name: Deploy production

# Only `main` deploys to production, and only through the protected
# `production` GitHub environment (configure required reviewers in
# Settings -> Environments -> production). Targets ONLY the
# workos-platform-production Worker and its own D1/R2/KV.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full validation
        run: npm run lint && npm run typecheck && npm run build:client && npm test && npm run build:worker
      - name: Record a restore point (D1 Time Travel; the data never leaves Cloudflare)
        run: |
          npx wrangler d1 time-travel info "workos-platform-production-db" --env "production" --json > restore-point.json
          BOOKMARK=$(node -e "const s=require('fs').readFileSync('restore-point.json','utf8');const j=JSON.parse(s.slice(s.indexOf('{'),s.lastIndexOf('}')+1));process.stdout.write(String(j.bookmark||''))")
          rm -f restore-point.json
          if [ -z "$BOOKMARK" ]; then echo "::error::Could not record a D1 restore point; nothing was migrated."; exit 1; fi
          {
            echo "### Restore point before this deploy"
            echo
            echo "D1 Time Travel bookmark: \`$BOOKMARK\`"
            echo
            echo "To go back: \`npx wrangler d1 time-travel restore workos-platform-production-db --bookmark=$BOOKMARK --env production\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply migrations
        run: npx wrangler d1 migrations apply DB --remote --env production
      - name: Deploy
        run: npx wrangler deploy --env production --message "${GITHUB_SHA::7} production"
      - name: Smoke test production
        id: smoke
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/smoke.mjs "$PRODUCTION_URL"
      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        run: npx wrangler rollback --env production --message "Automatic rollback after failed smoke test" -y
