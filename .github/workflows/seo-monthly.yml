# KEVOS AutoSEO: monthly technical review and strategy report. See seo/AUTOMATION-RUNBOOK.md.
# Read-only token; missing credentials are reported as UNKNOWN, never treated as zero.
name: SEO monthly
on:
  schedule:
    - cron: '0 21 1 * *' # 2nd of the month, morning in Sydney
  workflow_dispatch:
permissions:
  contents: read

# One AutoSEO job at a time, so runs never write conflicting history.
concurrency:
  group: kevos-autoseo
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Restore AutoSEO history
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .seo-data
          key: seo-data-${{ github.run_id }}
          restore-keys: seo-data-
      - name: Install pinned dependencies
        run: npm ci
      - name: Build the site
        run: npm run build
      - name: SEO gate and URL inventory
        run: |
          node scripts/seo/validate.mjs
          node scripts/seo/inventory.mjs
      - name: Collect Search Console, Bing and Cloudflare data
        run: node scripts/seo/run.mjs collect
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          BING_SITE_URL: ${{ vars.BING_SITE_URL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
      - name: Check production
        run: node scripts/seo/run.mjs live-check
      - name: monthly report and proposals
        if: always()
        run: node scripts/seo/run.mjs report --period monthly
      - name: Keep this run's data and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seo-monthly-${{ github.run_id }}
          path: .seo-data/
          retention-days: 90
          # .seo-data/ is a dot-directory: upload-artifact v4.4+ skips hidden paths unless told otherwise.
          include-hidden-files: true
          if-no-files-found: ignore
