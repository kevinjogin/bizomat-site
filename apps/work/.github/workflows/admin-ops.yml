name: Admin operations

# Manually started, privileged operations against a deployed environment.
#   audit         read-only: deployment, custom domains, row counts (no personal data
#                 except whether the configured founder email exists)
#   backup        record a D1 Time Travel restore point (bookmark) in the job summary. The data never leaves
#                 Cloudflare: this repository is public, so database exports are never uploaded as artifacts.
#   grant-founder bind founder-admin rights to the EXISTING account with `email`
#   revoke-admin  remove platform-admin rights from the account with `email`
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [audit, backup, grant-founder, revoke-admin]
        default: audit
      environment:
        type: choice
        options: [preview, production]
        default: preview
      email:
        description: Account email (grant-founder / revoke-admin / audit founder check)
        type: string
        default: kevin@kevos.com

permissions:
  contents: read

concurrency:
  group: admin-ops-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OP: ${{ inputs.operation }}
      TARGET_ENV: ${{ inputs.environment }}
      ACCOUNT_EMAIL: ${{ inputs.email }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run operation
        run: node scripts/admin-ops.mjs
      - name: Artifact policy (no database, dump or secret is ever uploaded)
        run: node scripts/check-artifact-policy.mjs
