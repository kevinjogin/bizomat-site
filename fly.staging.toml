# BIZOMAT staging: the Fly app `bizomat-staging` (syd), where every release is tested before production
# (owner, 19 Nov 2026; docs/deployment/staging.md). It runs the production image with production's settings, so the
# website and the apps behave as on bizomat.ai, plus one group of its own in front: the password gate.
#
#   https://bizomat-staging.fly.dev  ->  gate   password (HTTP Basic, user "review"), noindex; rewrites every
#                                               https://bizomat.ai link in answers to the staging address, so nothing
#                                               leads to production (infrastructure/preview/gate.mjs)
#                                    ->  proxy  as on bizomat.ai: the gate sends every request with Host bizomat.ai
#                                    ->  web, work (and /cad answers 502: CAD Automation runs only in production)
#
# Never production data: staging starts empty and holds invented data only. Never production settings either: Stripe
# runs in test mode with no keys until test keys are added, email goes to the log, and there is no Google sign-in.
#
# Fly's private network is shared by every app of the organisation, so each upstream below names a staging Machine
# explicitly (*.process.bizomat-staging.internal). The router's default for /cad would otherwise be a production
# name; infrastructure/fly/test/check-config.py refuses any upstream outside this app.
#
# Deployed only from GitHub Actions (.github/workflows/bizomat-staging.yml, token FLY_STAGING_TOKEN), never by hand.
# The gate's password is the Fly secret GATE_PASSWORD, staged by that workflow from the repository secret
# STAGING_PASSWORD (values never printed).

app = "bizomat-staging"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "infrastructure/fly/Dockerfile"
  ignorefile = ".dockerignore"
  build-target = "runtime-website"

[deploy]
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "10m"

[processes]
  gate = "/usr/local/bin/bizomat-entrypoint gate"
  proxy = "/usr/local/bin/bizomat-entrypoint proxy"
  web = "/usr/local/bin/bizomat-entrypoint web"
  work = "/usr/local/bin/bizomat-entrypoint work"

[env]
  # gate (role "gate": refused outside an app named *-staging, and without GATE_PASSWORD)
  GATE_UPSTREAM = "http://proxy.process.bizomat-staging.internal:8080"
  GATE_PUBLIC_ORIGIN = "https://bizomat-staging.fly.dev"
  GATE_REALM = "BIZOMAT staging"
  # proxy: staging's own Machines only. CAD Automation is not part of staging; this name does not exist, so /cad
  # answers 502 rather than ever reaching the production app cados.
  UPSTREAM_WEB = "http://web.process.bizomat-staging.internal:8003"
  UPSTREAM_WORK = "http://work.process.bizomat-staging.internal:8002"
  UPSTREAM_CAD = "http://cad.process.bizomat-staging.internal:8001"
  BIZOMAT_PREVIEW_ROUTING = "0"
  # Every request reaches the proxy from the gate over the private network, which the proxy does not trust for the
  # visitor's address by default. Here the gate is the only door, so the proxy reads Fly-Client-IP from it: each
  # tester keeps their own address for the rate limits, as on bizomat.ai.
  PROXY_UNTRUSTED_PEERS = ""
  PROXY_SHUTDOWN_GRACE_MS = "3000"
  # work: production's settings (the gate makes every request look like bizomat.ai), except where staging differs.
  WORK_APP_URL = "https://bizomat.ai/tasks"
  WORK_APP_NAME = "BIZOMAT Project Management (staging)"
  WORK_ENVIRONMENT = "staging"
  WORK_ALLOW_SIGNUP = "true"
  WORK_SESSION_TTL_HOURS = "72"
  WORK_CANONICAL_URL = "https://bizomat.ai/tasks"
  # Email is written to the log only: staging never sends mail.
  WORK_EMAIL_PROVIDER = "log"
  # Stripe in test mode only. Billing stays off until test keys are set as Fly secrets of this app.
  WORK_STRIPE_ENVIRONMENT = "test"

[http_service]
  processes = ["gate"]
  internal_port = 8080
  force_https = true
  # The gate stops when nobody uses staging and starts on the next visit.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400
  [http_service.http_options]
    idle_timeout = 600

[checks]
  [checks.gate]
    processes = ["gate"]
    type = "http"
    port = 8080
    method = "get"
    path = "/__gate/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
  [checks.proxy]
    processes = ["proxy"]
    type = "http"
    port = 8080
    method = "get"
    path = "/__proxy/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
  [checks.web]
    processes = ["web"]
    type = "http"
    port = 8003
    method = "get"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
  [checks.work]
    processes = ["work"]
    type = "http"
    port = 8002
    method = "get"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# Staging's own data (invented only): one volume on its one work Machine, made by the first deploy.
[[mounts]]
  source = "work_data"
  destination = "/data"
  processes = ["work"]
  initial_size = "1gb"
  snapshot_retention = 7
  scheduled_snapshots = true
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "3GB"

# The same sizes as production (fly.website.toml), so tests run on a faithful copy; the gate is staging's own.
[[vm]]
  processes = ["gate"]
  size = "shared-cpu-1x"
  memory = "256mb"

[[vm]]
  processes = ["proxy"]
  size = "shared-cpu-1x"
  memory = "256mb"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["work"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[restart]]
  policy = "always"
  processes = ["work"]
