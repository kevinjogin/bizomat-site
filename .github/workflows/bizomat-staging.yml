# BIZOMAT staging: deploy, start or stop the Fly app `bizomat-staging` (fly.staging.toml; docs/deployment/staging.md).
# Run by hand only: Actions > BIZOMAT staging (bizomat-staging) > Run workflow, on the branch to test (any branch).
# No push, merge, tag or schedule starts it.
#
# It only ever targets the app `bizomat-staging` (fixed below) with its own token, never production: the configuration
# names that app, infrastructure/fly/test/check-config.py checks that every upstream is one of staging's own Machines,
# and the preflight refuses a configuration of another app. It never creates an app or an IP address, and never
# touches the apps bizomat or cados, DNS or Cloudflare.
#
# Repository secrets (Settings > Secrets and variables > Actions):
# - FLY_STAGING_TOKEN: a deploy token for bizomat-staging only (`fly tokens create deploy -a bizomat-staging`).
# - STAGING_PASSWORD (optional): the gate's password (user "review"), 16 characters or more. Set it without showing it:
#   `gh secret set STAGING_PASSWORD --repo kevinjogin/bizomat-site` (it asks for the value, hidden). Without it, the
#   password is derived from FLY_STAGING_TOKEN (read it with `fly ssh console -a bizomat-staging -C "printenv
#   GATE_PASSWORD"`). Each deploy stages it as the Fly secret GATE_PASSWORD; it is never printed.
#
# action:
# - deploy: the config check, the preflight (the first deploy creates the Machines and the volume: type YES in
#   allow_machine_change), the gate password, the image built once on the runner and pushed, the deploy, a check that
#   every Machine runs the new image, then the checks through the gate. When a check fails after the deploy, the image
#   that ran before is deployed again automatically and the run fails.
# - stop: stops every Machine of staging (only the volume and the image are then billed). The gate also stops by itself
#   when nobody visits; the other Machines do not, so stop staging when testing is done.
# - start: starts every Machine again (or deploy, which starts them too).
name: BIZOMAT staging (bizomat-staging)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy this branch, verify it (flags off, on in staging, off again), verify with every flag off only, start the Machines, or stop them"
        required: true
        type: choice
        options: [deploy, verify, verify-flags-off, start, stop]
        default: deploy
      allow_machine_change:
        description: Type YES for the first deploy (it creates the Machines) or a deliberate change of the Machines
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bizomat-staging
  cancel-in-progress: false

env:
  APP: bizomat-staging
  CONFIG: fly.staging.toml
  STAGING_URL: https://bizomat-staging.fly.dev

jobs:
  staging:
    if: ${{ !startsWith(inputs.action, 'verify') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the secrets
        env:
          HAS_TOKEN: ${{ secrets.FLY_STAGING_TOKEN != '' }}
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the repository secret FLY_STAGING_TOKEN (fly tokens create deploy -a bizomat-staging). Nothing was changed."
            exit 1
          fi
          if [ "$ACTION" = deploy ] && [ -n "$STAGING_PASSWORD" ]; then
            if [ "${#STAGING_PASSWORD}" -lt 16 ]; then
              echo "::error::STAGING_PASSWORD must be 16 characters or more. Nothing was changed."
              exit 1
            fi
            # One line, no quotes, backslashes or spaces: it travels through flyctl secrets import and HTTP Basic.
            allowed='^[A-Za-z0-9._~+/=!@#%^&*,:;?-]+$'
            if ! [[ "$STAGING_PASSWORD" =~ $allowed ]]; then
              echo "::error::STAGING_PASSWORD may use letters, digits and ._~+/=!@#%^&*,:;?- only (no spaces, quotes or backslashes). Nothing was changed."
              exit 1
            fi
          fi

      # The gate's password: STAGING_PASSWORD when it is set; otherwise one derived from the staging Fly token (the same
      # on every deploy while the token stays the same; 40 hex characters). Masked in the log and never printed. Read it
      # with `fly ssh console -a bizomat-staging -C "printenv GATE_PASSWORD"`, or set STAGING_PASSWORD to choose one.
      - name: The gate password (never printed)
        if: inputs.action == 'deploy'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
        run: |
          pw="$STAGING_PASSWORD"
          if [ -z "$pw" ]; then
            pw="$(python3 -c 'import hashlib, hmac, os; print(hmac.new(os.environ["FLY_API_TOKEN"].encode(), b"bizomat-staging-gate-v1", hashlib.sha256).hexdigest()[:40])')"
            echo "- STAGING_PASSWORD is not set: the gate password is derived from the staging Fly token. Read it with \`fly ssh console -a bizomat-staging -C \"printenv GATE_PASSWORD\"\`, or set STAGING_PASSWORD to choose one." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "::add-mask::$pw"
          echo "GATE_PW=$pw" >> "$GITHUB_ENV"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Stop or start every Machine
        if: inputs.action != 'deploy'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |
          ids="$(flyctl machines list --app "$APP" --json | jq -r '.[].id')"
          if [ -z "$ids" ]; then
            echo "Staging has no Machines yet: run this workflow with action deploy first." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for id in $ids; do flyctl machine "$ACTION" "$id" --app "$APP"; done
          done_word=started; [ "$ACTION" = stop ] && done_word=stopped
          echo "- Staging: $(echo "$ids" | wc -w) Machines $done_word" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The staging configuration (only staging's own Machines, production sizes, test mode)
        if: inputs.action == 'deploy'
        run: python3 infrastructure/fly/test/check-config.py "$CONFIG"

      - name: Preflight (the deploy keeps the Machines as they are, unless allowed)
        if: inputs.action == 'deploy'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
          ALLOW_MACHINE_CHANGE: ${{ inputs.allow_machine_change }}
        run: python3 .github/scripts/fly-preflight.py --app "$APP" --config "$CONFIG"

      - name: Stage the gate password (never printed)
        if: inputs.action == 'deploy'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
        run: |
          printf 'GATE_PASSWORD=%s\n' "$GATE_PW" | flyctl secrets import --app "$APP" --stage >/dev/null
          echo "- Gate password staged as GATE_PASSWORD" >> "$GITHUB_STEP_SUMMARY"

      # The image that runs now, for the automatic rollback below (none before the first deploy).
      - name: Record the image that runs now
        if: inputs.action == 'deploy'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
        run: |
          previous="$(flyctl machines list --app "$APP" --json | jq -r '[.[] | select((.config.metadata.fly_process_group // "") == "work") | .config.image // empty][0] // empty')"
          echo "PREVIOUS_IMAGE=$previous" >> "$GITHUB_ENV"
          echo "- Before this deploy: ${previous:-no Machines yet (first deploy)}" >> "$GITHUB_STEP_SUMMARY"

      - name: Make room on the runner
        if: inputs.action == 'deploy'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Build and push the image (once)
        if: inputs.action == 'deploy'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
        run: |
          label="${GITHUB_SHA::7}-run${GITHUB_RUN_NUMBER}"
          flyctl deploy --config "$CONFIG" --app "$APP" --local-only --build-only --push --image-label "$label" \
            --build-arg BIZOMAT_VERSION="${GITHUB_SHA::7}"
          echo "IMAGE=registry.fly.io/$APP:$label" >> "$GITHUB_ENV"
          echo "IMAGE_LABEL=$label" >> "$GITHUB_ENV"

      # Staging is replaced as a whole (proxy, web, work and the gate together): a short outage of staging is fine.
      - name: Deploy
        if: inputs.action == 'deploy'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
        run: |
          echo "DEPLOY_STARTED=1" >> "$GITHUB_ENV"
          flyctl deploy --config "$CONFIG" --app "$APP" --image "$IMAGE" --ha=false --wait-timeout 10m

      - name: Every Machine runs the new image
        if: inputs.action == 'deploy'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
        run: |
          for _ in $(seq 1 36); do
            ok=1
            list="$(flyctl machines list --app "$APP" --json 2>/dev/null || echo '[]')"
            for g in proxy web work; do
              n="$(jq --arg g "$g" --arg l "$IMAGE_LABEL" '[.[] | select((.config.metadata.fly_process_group // "") == $g) | select(.state == "started") | select(((.config.image // "") | endswith(":" + $l)) or ((.image_ref.tag // "") == $l))] | length' <<<"$list")"
              [ "$n" -ge 1 ] || ok=0
            done
            # The gate may already have stopped itself (no visitors): it must at least run the new image.
            n="$(jq --arg l "$IMAGE_LABEL" '[.[] | select((.config.metadata.fly_process_group // "") == "gate") | select(((.config.image // "") | endswith(":" + $l)) or ((.image_ref.tag // "") == $l))] | length' <<<"$list")"
            [ "$n" -ge 1 ] || ok=0
            if [ "$ok" = 1 ]; then
              echo "- $IMAGE_LABEL runs on gate, proxy, web and work" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The Machines did not all run $IMAGE_LABEL within 3 minutes (flyctl logs -a $APP)."
          exit 1

      # Through the gate, as a tester sees staging. Each check waits up to 90 s (the gate starts on the first visit).
      - name: Checks through the gate
        if: inputs.action == 'deploy'
        run: |
          # The sign-in header from a private file (curl -H @file): the password is never on a command line or printed.
          auth="$(mktemp)"; chmod 600 "$auth"
          printf 'Authorization: Basic %s\n' "$(printf 'review:%s' "$GATE_PW" | base64 -w0)" > "$auth"
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$@"; }
          fail=0
          check() { # description, expected code, curl arguments...
            local what="$1" want="$2" got=""; shift 2
            for _ in $(seq 1 18); do got="$(code "$@")"; [ "$got" = "$want" ] && break; sleep 5; done
            if [ "$got" = "$want" ]; then echo "- ok: $what ($got)" | tee -a "$GITHUB_STEP_SUMMARY"
            else echo "- FAILED: $what (wanted $want, got $got)" | tee -a "$GITHUB_STEP_SUMMARY"; fail=1; fi
          }
          check "the gate answers" 200 "$STAGING_URL/__gate/health"
          check "without the password nothing is shown" 401 "$STAGING_URL/"
          check "the website" 200 -H @"$auth" "$STAGING_URL/"
          check "the systems catalogue" 200 -H @"$auth" "$STAGING_URL/systems/"
          check "BIZOMAT ERP sign-in" 200 -H @"$auth" "$STAGING_URL/erp/login"
          check "Project Management's API" 200 -H @"$auth" "$STAGING_URL/tasks/api/health"
          check "/cad never reaches production (CAD runs only there)" 502 -H @"$auth" "$STAGING_URL/cad/"
          # Answers stay out of search and no link leads to production.
          page="$(curl -s -D "$RUNNER_TEMP/headers" --max-time 15 -H @"$auth" "$STAGING_URL/")"
          if grep -qi '^x-robots-tag: noindex' "$RUNNER_TEMP/headers"; then echo "- ok: noindex" | tee -a "$GITHUB_STEP_SUMMARY"
          else echo "- FAILED: no X-Robots-Tag noindex" | tee -a "$GITHUB_STEP_SUMMARY"; fail=1; fi
          if grep -Eq 'https?://(www\.)?bizomat\.ai([/"'"'"' ]|$)' <<<"$page"; then echo "- FAILED: the home page links to production" | tee -a "$GITHUB_STEP_SUMMARY"; fail=1
          else echo "- ok: no link to production on the home page" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          rm -f "$auth"
          [ "$fail" = 0 ] || { echo "::error::A staging check failed (see the summary)."; exit 1; }

      # A deploy whose checks fail is taken back: the image that ran before is deployed again, and the run still fails.
      - name: Automatic rollback (only when the deploy or its checks failed)
        if: failure() && inputs.action == 'deploy' && env.DEPLOY_STARTED == '1'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
        run: |
          if [ -z "${PREVIOUS_IMAGE:-}" ]; then
            echo "- Rollback: nothing to go back to (this was the first deploy); staging is left as it is for diagnosis" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          flyctl deploy --config "$CONFIG" --app "$APP" --image "$PREVIOUS_IMAGE" --ha=false --wait-timeout 10m
          echo "- Rollback: $PREVIOUS_IMAGE deployed again" | tee -a "$GITHUB_STEP_SUMMARY"

  # Verifies a release on staging as a tester would, through the gate, in a real browser (docs/deployment/staging.md,
  # "Verifying a release"; infrastructure/staging/verify.mjs). Uses only the staging token and the staging address.
  #   1. prepare     staging's own sign-up policy accepts invented example.com addresses (email goes to the log there)
  #   2. flags off   every page and every ERP module with the flags off: the release as production will run it
  #   3. flags on    (action verify) new_ui_enabled, company_members_v2 and cad_in_erp on in staging only; the website must follow
  #   4. flags off   switched off again (always, even when a check failed), and the old look must come back
  # The flags are switched in staging's database by infrastructure/staging/staging-db.mjs, sent to the work Machine with
  # flyctl and run as the work user. Production's flags are changed only in the Control Centre, with the owner's approval.
  verify:
    if: ${{ startsWith(inputs.action, 'verify') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check the secret
        env:
          HAS_TOKEN: ${{ secrets.FLY_STAGING_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the repository secret FLY_STAGING_TOKEN (fly tokens create deploy -a bizomat-staging)."
            exit 1
          fi

      # The same password the staging deploy gives the gate (bizomat-staging.yml); masked, never printed.
      - name: The gate password (never printed)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
        run: |
          pw="$STAGING_PASSWORD"
          if [ -z "$pw" ]; then
            pw="$(python3 -c 'import hashlib, hmac, os; print(hmac.new(os.environ["FLY_API_TOKEN"].encode(), b"bizomat-staging-gate-v1", hashlib.sha256).hexdigest()[:40])')"
          fi
          echo "::add-mask::$pw"
          echo "GATE_PW=$pw" >> "$GITHUB_ENV"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: A browser (Playwright, the version the website pins)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          v="$(node -p "require('$GITHUB_WORKSPACE/package.json').devDependencies?.playwright ?? require('$GITHUB_WORKSPACE/package.json').dependencies?.playwright")"
          npm i --no-audit --no-fund "playwright@$v" >/dev/null
          npx playwright install --with-deps --only-shell chromium >/dev/null
          echo "PW_DIR=$RUNNER_TEMP/pw" >> "$GITHUB_ENV"
          echo "VERIFY_STATE=$RUNNER_TEMP/verify-state.json" >> "$GITHUB_ENV"

      - name: Staging answers (the gate starts on the first visit)
        run: |
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$STAGING_URL/__gate/health")" = 200 ] && exit 0
            sleep 5
          done
          echo "::error::Staging does not answer: start it with the staging workflow (action start) or deploy it."
          exit 1

      - name: The work Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
        run: |
          id="$(flyctl machines list --app "$APP" --json | jq -r '[.[] | select((.config.metadata.fly_process_group // "") == "work") | select(.state == "started")][0].id // empty')"
          [ -n "$id" ] || { echo "::error::No started work Machine in $APP."; exit 1; }
          echo "WORK_ID=$id" >> "$GITHUB_ENV"
          # staging-db MODE: the helper, sent base64 (no quoting problems), run as the work user (uid 10003).
          cat > "$RUNNER_TEMP/stagingdb.sh" <<'SH'
          set -euo pipefail
          mode="$1"
          b64="$(base64 -w0 infrastructure/staging/staging-db.mjs)"
          cmd="sh -c 'echo $b64 | base64 -d > /tmp/staging-db.mjs && FLY_APP_NAME=$APP setpriv --reuid=10003 --regid=10003 --clear-groups /usr/local/bin/node /tmp/staging-db.mjs $mode'"
          out="$(flyctl machine exec "$WORK_ID" "$cmd" --app "$APP" 2>&1 || true)"
          if ! grep -q '^staging-db {' <<<"$out"; then
            out="$(flyctl ssh console --app "$APP" --machine "$WORK_ID" -C "$cmd" 2>&1 || true)"
          fi
          line="$(grep '^staging-db {' <<<"$out" | tail -1 || true)"
          if [ -z "$line" ]; then
            echo "$out" | grep -v -i 'token' | tail -5
            echo "::error::staging-db $mode did not run on $WORK_ID."
            exit 1
          fi
          echo "- staging database: ${line#staging-db }" | tee -a "$GITHUB_STEP_SUMMARY"
          SH

      - name: Prepare (staging's sign-up policy accepts example.com)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
        run: bash "$RUNNER_TEMP/stagingdb.sh" prepare

      - name: Every flag off
        run: node infrastructure/staging/verify.mjs off

      - name: Switch the flags on (staging only)
        id: on
        if: inputs.action == 'verify'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
        run: bash "$RUNNER_TEMP/stagingdb.sh" flags-on

      - name: With the flags on
        if: inputs.action == 'verify'
        run: node infrastructure/staging/verify.mjs on

      - name: Switch the flags off again (always)
        if: always() && steps.on.conclusion != 'skipped' && inputs.action == 'verify'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
        run: bash "$RUNNER_TEMP/stagingdb.sh" flags-off

      - name: The old look is back
        if: always() && steps.on.conclusion == 'success'
        run: node infrastructure/staging/verify.mjs reset

      - name: Forget the tester
        if: always()
        run: rm -f "$RUNNER_TEMP/verify-state.json"
