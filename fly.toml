# BIZOMAT production: ONE Fly.io app (`cados`), ONE Machine in Sydney, 1 GB (docs/BIZOMAT-SINGLE-APP.md).
#
# Deployed only by GitHub Actions (.github/workflows/deploy.yml) on every push to main, after the checks pass. The
# image is built on the GitHub runner (infrastructure/fly/Dockerfile) and pushed to Fly; nothing is built or deployed
# from a laptop. The app's secrets stay on Fly (fly secrets); none is in this file or in the repository.
#
# One Machine runs, supervised by `bizomat-entrypoint all` (each as its own user, with only its own settings):
#   proxy  :8080  the only public port. Routes by host and path (infrastructure/proxy/routes.mjs) and hosts the
#                 website's four pages in its own process (BIZOMAT_EMBED_WEB: /, /cad-automation/, /work/,
#                 /engine-room/, contact and legal pages, retired-section redirects)
#   cad    :8001  CAD MCP: the SOLIDWORKS MCP server, OAuth, the device bridge, installer and update endpoints
#   work   :8002  Task Management (Project Management): accounts, projects, tasks, SQLite
#
#   bizomat.ai/            website        bizomat.ai/cad/...  CAD MCP      bizomat.ai/tasks/...  Task Management
#   bizomat.ai/mcp, /oauth/..., /v2/..., /.well-known/oauth-*     CAD MCP (the root paths connectors already use)
#   www.bizomat.ai         301 to bizomat.ai
#   cados.fly.dev          every path to CAD MCP, as before the consolidation (connectors, add-ins and Companions
#                          set up with it keep working; browsers are sent on to bizomat.ai/cad by the CAD app)
#
# Memory, measured with all three running together (docs/BIZOMAT-SINGLE-APP.md, "Memory"): about 610 MB idle and
# 660 MB after 1,000 requests. That fits 1 GB only because CAD geometry runs in the CAD server's own process
# (OPENSKETCH_CAD_WORKERS = "0"): each separate CAD worker process would add about 400 MB. Swap (below) is a safety
# margin against a short peak, not working memory.

app = "cados"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 20
swap_size_mb = 512

[build]
  dockerfile = "infrastructure/fly/Dockerfile"
  ignorefile = ".dockerignore"

[deploy]
  # One Machine with a volume: it is replaced in place (CAD MCP and Task Management are offline for the restart,
  # typically 30-90 s while OpenCascade loads; add-ins, Companions and open boards reconnect by themselves).
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "10m"

[processes]
  all = "/usr/local/bin/bizomat-entrypoint all"

[env]
  # The services this Machine runs, and the website inside the proxy (no separate web process).
  BIZOMAT_ROLES = "cad work proxy"
  BIZOMAT_EMBED_WEB = "1"
  UPSTREAM_CAD = "http://127.0.0.1:8001"
  UPSTREAM_WORK = "http://127.0.0.1:8002"
  UPSTREAM_WEB = "http://127.0.0.1:8003"
  BIZOMAT_PREVIEW_ROUTING = "0"
  # Task Management (passed to the work role as APP_URL, APP_NAME, ...; infrastructure/fly/entrypoint.sh). Sign-up and
  # session length as before. Email and password sign-in; no secret is needed for it.
  WORK_APP_URL = "https://bizomat.ai/tasks"
  WORK_APP_NAME = "BIZOMAT Project Management"
  WORK_ENVIRONMENT = "production"
  WORK_ALLOW_SIGNUP = "true"
  WORK_SESSION_TTL_HOURS = "72"
  WORK_CANONICAL_URL = "https://bizomat.ai/tasks"
  # CAD MCP: the same public address as before (OAuth metadata, links); its old host names keep working for programs
  # and send browsers to bizomat.ai/cad. Its secrets (signing keys, Google sign-in) stay the cados app's Fly secrets.
  OPENSKETCH_PUBLIC_URL = "https://bizomat.ai/cad"
  OPENSKETCH_REDIRECT_HOSTS = "cados.fly.dev,cados.kevos.com,cad.bizomat.ai"
  # Geometry in the CAD server's process: no ~400 MB worker processes (the 1 GB budget). A very heavy call (a large
  # assembly read from SOLIDWORKS) holds the server for its length; the add-in and the MCP clients retry.
  OPENSKETCH_CAD_WORKERS = "0"

[http_service]
  processes = ["all"]
  internal_port = 8080
  force_https = true
  # One Machine, always on: the website, MCP connections and the add-ins' long polls need it available.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 400
    hard_limit = 1000
  [http_service.http_options]
    # MCP event streams and the add-in's long poll stay open for minutes
    idle_timeout = 600

[checks]
  [checks.proxy]
    processes = ["all"]
    type = "http"
    port = 8080
    method = "get"
    path = "/__proxy/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
  [checks.cad]
    processes = ["all"]
    type = "http"
    port = 8001
    method = "get"
    path = "/healthz"
    interval = "30s"
    timeout = "8s"
    # OpenCascade loads slowly
    grace_period = "120s"
  [checks.work]
    processes = ["all"]
    type = "http"
    port = 8002
    method = "get"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"

# The cados app's existing volume. It held CAD Automation's data at its root; the first start of this image moves it
# into /data/cad (infrastructure/fly/adopt-cados-volume.sh, same-disk renames only, counted before and after) and
# Task Management's data is imported into /data/work (.github/workflows/consolidate-work-data.yml). Take a snapshot
# before the first deploy (the runbook does); scheduled daily snapshots are kept 30 days.
[[mounts]]
  source = "opensketch_data"
  destination = "/data"
  processes = ["all"]
  snapshot_retention = 30
  scheduled_snapshots = true
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "20GB"

# 1 GB, as decided. Two shared vCPUs so a CAD geometry call does not starve the proxy and Task Management.
[[vm]]
  processes = ["all"]
  size = "shared-cpu-2x"
  memory = "1gb"

[[restart]]
  policy = "always"
  processes = ["all"]
