# BIZOMAT on Fly.io: the website, the router behind bizomat.ai, Project Management and CAD Automation (owner's
# decisions, 6 Nov 2026: the website on Fly.io, kevos.com back to the old KEVOS site on Cloudflare; Project Management
# on Fly.io at bizomat.ai/tasks; one Fly app for the whole platform, CAD Automation's group in Sydney with its data).
#
#   bizomat.ai/...       -> web    the BIZOMAT website (this app)
#   bizomat.ai/cad/...   -> cad    CAD Automation, in this app's cad group in syd with its data on the volume cad_data
#                                  (moved from the Fly app `cados` with bizomat.ps1 move cad:
#                                  infrastructure/migrate/cad/README.md)
#   bizomat.ai/tasks/... -> work   Project Management, in this app with its data on the volume work_data (moved from
#                                  Cloudflare on 6 Nov 2026: docs/BIZOMAT-DEPLOYMENT.md, section 6c)
#   bizomat.ai/login     -> 301    /sign-in/, the website's page that offers each application's sign-in
#   bizomat.fly.dev/...  -> 301    the same path on bizomat.ai (the app's own address is not a second address of the
#                                  platform; /__proxy/health and /__proxy/ready stay, for checks)
#
# Deploy from the owner's laptop: bizomat.ps1 deploy website, which runs
#   fly deploy --config fly.website.toml --remote-only --ha=false --build-arg BIZOMAT_VERSION=<commit>
# Same image as fly.toml (infrastructure/fly/Dockerfile, the full plan). CAD Automation is apps/cad, an exact copy of
# a CADOS commit (apps/cad-source.json, scripts/sync-cad.mjs). --ha=false keeps one Machine per group: work and cad must
# never have two (each would get its own empty volume).

app = "bizomat"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "infrastructure/fly/Dockerfile"
  ignorefile = ".dockerignore"

[deploy]
  # rolling is the only strategy for Machines with volumes. work and cad are offline while their Machine is replaced
  # (10-60 s; cad up to 90 s while OpenCascade loads): the proxy answers 502 meanwhile, open boards reconnect, and the
  # CAD add-ins and Companions retry.
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "10m"

[processes]
  proxy = "/usr/local/bin/bizomat-entrypoint proxy"
  web = "/usr/local/bin/bizomat-entrypoint web"
  work = "/usr/local/bin/bizomat-entrypoint work"
  cad = "/usr/local/bin/bizomat-entrypoint cad"

[env]
  UPSTREAM_WEB = "http://web.process.bizomat.internal:8003"
  UPSTREAM_WORK = "http://work.process.bizomat.internal:8002"
  # Where bizomat.ai/cad goes: this app's cad group, since bizomat.ps1 move cad switched the running router there (the
  # old Fly app cados, http://cados.internal:8080, before it). bizomat.ps1 deploy website refuses while the router and
  # this line disagree, so a deploy never moves CAD Automation away from its data; after bizomat.ps1 back cad, set this
  # back to http://cados.internal:8080.
  UPSTREAM_CAD = "http://cad.process.bizomat.internal:8001"
  # bizomat.ai/tasks/... reaches work (no TASKS_REDIRECT_ORIGIN since the switch, 6 Nov 2026). To send it back to the old
  # address for a while: TASKS_REDIRECT_ORIGIN = "https://work.kevos.com" (302, prefix off).
  # Off outside a cutover: bizomat.fly.dev then answers 301 to bizomat.ai. "1" turns on the preview switch
  # (https://bizomat.fly.dev/__preview/{web,work,cad}) for checking a backend before it goes live.
  BIZOMAT_PREVIEW_ROUTING = "0"
  # work: passed to the work role as APP_URL, APP_NAME, ENVIRONMENT, ALLOW_SIGNUP and SESSION_TTL_HOURS
  # (infrastructure/fly/entrypoint.sh). Sign-up and session length as work.kevos.com runs today: open sign-up, 72 h.
  # It signs people in with email and password only; Google sign-in is off on work.kevos.com, so no secret is needed.
  WORK_APP_URL = "https://bizomat.ai/tasks"
  WORK_APP_NAME = "BIZOMAT Project Management"
  WORK_ENVIRONMENT = "production"
  WORK_ALLOW_SIGNUP = "true"
  WORK_SESSION_TTL_HOURS = "72"
  # Its address: a page asked for on another host (work.kevos.com once it points here, bizomat.fly.dev) answers 301 to
  # the same path under it; /api/ and the files keep answering there for open tabs.
  WORK_CANONICAL_URL = "https://bizomat.ai/tasks"
  # cad: the same settings as the cados app's fly.toml (CADOS). CAD Automation lives at bizomat.ai/cad
  # (apps/cad/opensketch/canonical.py serves the prefix and writes it into every link; its OAuth metadata is at the
  # root of bizomat.ai). Its old host names: a browser asking one of them for a page gets a 301 to bizomat.ai/cad, and
  # programs (MCP, OAuth, the add-in link, the Companion's API) keep working there with that host's own address. The
  # entrypoint passes OPENSKETCH_* to the cad role only, and sets OPENSKETCH_DATA=/data/cad itself.
  OPENSKETCH_PUBLIC_URL = "https://bizomat.ai/cad"
  OPENSKETCH_REDIRECT_HOSTS = "cados.fly.dev,cados.kevos.com,cad.bizomat.ai"

[http_service]
  processes = ["proxy"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 800
    hard_limit = 1500
  [http_service.http_options]
    idle_timeout = 600

[checks]
  [checks.proxy]
    processes = ["proxy"]
    type = "http"
    port = 8080
    method = "get"
    path = "/__proxy/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
  [checks.web]
    processes = ["web"]
    type = "http"
    port = 8003
    method = "get"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
  [checks.work]
    processes = ["work"]
    type = "http"
    port = 8002
    method = "get"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
  # cad: the CAD server's /healthz, or the holding page's (200, "ok": false) while it waits for its data or is in
  # maintenance, so a deploy never waits on a Machine that is idle on purpose
  [checks.cad]
    processes = ["cad"]
    type = "http"
    port = 8001
    method = "get"
    path = "/healthz"
    interval = "15s"
    timeout = "8s"
    # OpenCascade loads slowly and the supervisor starts the server as a child
    grace_period = "90s"

# Project Management's data: one volume on its one Machine (created by the first deploy), snapshotted daily and kept
# 30 days. The data move puts db.sqlite and files/ in /data/work (infrastructure/migrate/work).
[[mounts]]
  source = "work_data"
  destination = "/data"
  processes = ["work"]
  initial_size = "3gb"
  snapshot_retention = 30
  scheduled_snapshots = true
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "20GB"

# CAD Automation's data: one volume in syd on its one Machine (bizomat.ps1 deploy website creates it, 3 GB with daily
# snapshots kept 30 days, before the first deploy with the cad group), snapshotted daily. The data move puts the old
# cados volume's files in /data/cad (infrastructure/migrate/cad).
[[mounts]]
  source = "cad_data"
  destination = "/data"
  processes = ["cad"]
  initial_size = "3gb"
  snapshot_retention = 30
  scheduled_snapshots = true
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "20GB"

[[vm]]
  processes = ["proxy"]
  size = "shared-cpu-1x"
  memory = "256mb"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["work"]
  size = "shared-cpu-1x"
  memory = "512mb"

# cad keeps the dedicated core and 2 GB the cados app has: heavy CAD work on a shared CPU uses up the burst allowance.
# It has no service of its own, so Fly cannot stop or wake it: it runs all the time (cados suspended when idle).
[[vm]]
  processes = ["cad"]
  size = "performance-1x"
  memory = "2gb"

# Restart work and cad whenever their process exits (the entrypoint exits non-zero on a missing volume: the loop then
# shows in fly logs until it is fixed; in maintenance mode they stay up without the service, for a data move).
[[restart]]
  policy = "always"
  processes = ["work"]

[[restart]]
  policy = "always"
  processes = ["cad"]
