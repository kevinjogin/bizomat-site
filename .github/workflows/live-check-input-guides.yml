# Temporary diagnostic: checks the WORKOS input guides on the live kevos.com in a real browser. Removed after use.
name: Live check (input guides)
on:
  push:
    branches: [claude/loving-mccarthy-oubwh2]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Chromium
        run: npm i --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Open live tools in a browser
        shell: bash
        run: |
          cat > check.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const note = (t, m) => console.log(`::notice title=${t}::${m}`);
          const b = await chromium.launch();
          for (const [name, opts] of [['desktop', { viewport: { width: 1280, height: 900 } }], ['phone', devices['iPhone 13']]]) {
            const ctx = await b.newContext(opts);
            const p = await ctx.newPage();
            const errs = [];
            p.on('console', (m) => m.type() === 'error' && errs.push(m.text()));
            p.on('pageerror', (e) => errs.push(String(e)));
            for (const id of ['extension-spring', 'roi', 'turning-power']) {
              await p.goto(`https://kevos.com/tools/?tool=${id}`, { waitUntil: 'load' });
              await p.waitForTimeout(1500);
              const r = await p.evaluate(() => {
                const form = document.querySelector('#tool-form');
                const inputs = form.querySelectorAll('input[name], select[name]').length;
                const guides = form.querySelectorAll('details.ig').length;
                const first = form.querySelector('summary.ig-sum');
                const box = first ? first.getBoundingClientRect() : null;
                const vis = first ? getComputedStyle(first).display + '/' + getComputedStyle(first).visibility : 'none';
                form.querySelectorAll('details.ig').forEach((d) => (d.open = true));
                const svg = form.querySelector('details.ig svg');
                const sb = svg ? svg.getBoundingClientRect() : null;
                return { inputs, guides, summary: first?.textContent, box: box && `${Math.round(box.width)}x${Math.round(box.height)}`, vis, svg: sb && `${Math.round(sb.width)}x${Math.round(sb.height)}`, wide: document.documentElement.scrollWidth > innerWidth + 1, ui: typeof window.WORKOS_INPUT_GUIDE, entries: Object.keys(window.WORKOS_INPUTS || {}).length };
              });
              note(`${name} ${id}`, JSON.stringify(r));
            }
            note(`${name} errors`, errs.length ? errs.slice(0, 5).join(' | ').slice(0, 900) : 'none');
            await ctx.close();
          }
          await b.close();
          JS
          node check.mjs
