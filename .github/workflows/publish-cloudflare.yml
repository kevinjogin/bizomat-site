name: Provision and publish to Cloudflare

# One-time (manually started) workflow that creates the NEW, isolated
# WorkOS resources for an environment and publishes the Worker.
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to provision and publish
        type: choice
        options: [preview, production]
        default: preview
      reuse_existing:
        description: Resume an interrupted WorkOS run (reuse workos-platform-* resources it already created)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-cloudflare-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ENV: ${{ inputs.environment }}
      REUSE: ${{ inputs.reuse_existing }}
    steps:
      - name: Check secrets are configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate (lint, typecheck, tests, client build)
        run: npm run lint && npm run typecheck && npm run build:client && npm test
      - name: Verify Cloudflare token
        run: npx wrangler whoami
      - name: Provision isolated resources
        id: provision
        run: node scripts/cf-provision.mjs "$TARGET_ENV" $([ "$REUSE" = "true" ] && echo --reuse)
      - name: Back up the live database (before any migration)
        run: |
          npx wrangler d1 export "workos-platform-$TARGET_ENV-db" --remote --env "$TARGET_ENV" --output "backup-$TARGET_ENV-${GITHUB_SHA::7}.sql"
          ls -la backup-*.sql
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ inputs.environment }}-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 30
      - name: Rehearse pending migrations on a copy of the live data
        run: |
          set -e
          echo "Pending migrations:"; npx wrangler d1 migrations list DB --remote --env "$TARGET_ENV" || true
          rm -rf .wrangler/rehearsal
          # D1 exports tables alphabetically; reorder so referenced tables exist before data is inserted.
          node scripts/reorder-dump.mjs backup-*.sql rehearsal-import.sql
          npx wrangler d1 execute DB --local --env "$TARGET_ENV" --persist-to .wrangler/rehearsal --file rehearsal-import.sql --yes > /dev/null
          count() { npx wrangler d1 execute DB --local --env "$TARGET_ENV" --persist-to .wrangler/rehearsal --json --command "SELECT (SELECT COUNT(*) FROM users) AS u, (SELECT COUNT(*) FROM boards) AS b, (SELECT COUNT(*) FROM items) AS i, (SELECT COUNT(*) FROM workspaces) AS w" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s)[0].results[0];console.log(JSON.stringify(r))})"; }
          BEFORE=$(count); echo "Rows before: $BEFORE"
          npx wrangler d1 migrations apply DB --local --env "$TARGET_ENV" --persist-to .wrangler/rehearsal
          AFTER=$(count); echo "Rows after:  $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then echo "::error::Rehearsal changed core row counts — aborting before touching the live database"; exit 1; fi
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET_ENV"
      - name: Publish Worker
        run: npx wrangler deploy --env "$TARGET_ENV" --message "${GITHUB_SHA::7} publish"
      - name: Wait for workers.dev to serve the Worker
        env:
          APP_URL: ${{ steps.provision.outputs.url }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/api/health" >/dev/null; then echo "Live after $i attempt(s)"; exit 0; fi
            sleep 5
          done
          echo "::error::Worker did not become healthy at $APP_URL"; exit 1
      - name: Smoke test
        env:
          APP_URL: ${{ steps.provision.outputs.url }}
        run: node scripts/smoke.mjs "$APP_URL"
      - name: Summary
        env:
          APP_URL: ${{ steps.provision.outputs.url }}
          D1_ID: ${{ steps.provision.outputs.d1_id }}
          KV_ID: ${{ steps.provision.outputs.kv_id }}
        run: |
          {
            echo "## WorkOS published ($TARGET_ENV)"
            echo ""
            echo "- URL: $APP_URL"
            echo "- Worker: workos-platform-$TARGET_ENV"
            echo "- D1 database id: $D1_ID"
            echo "- KV namespace id: $KV_ID"
            echo "- R2 bucket: workos-platform-$TARGET_ENV-files"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "WORKOS_PUBLISHED url=$APP_URL d1=$D1_ID kv=$KV_ID"
