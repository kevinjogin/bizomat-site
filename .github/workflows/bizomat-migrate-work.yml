# Move Project Management data from Cloudflare (the preview environment that serves work.kevos.com: D1 database
# workos-platform-preview-db and R2 bucket workos-platform-preview-files) to the work Machine of the Fly app
# `bizomat` (/data/work: db.sqlite and files/). Run by hand only.
#
#   dry-run  export D1 and R2 on the runner, build the data folder (db.sqlite, files/, runtime.sqlite) with the
#            scripts below, verify it, and report COUNTS ONLY (tables, rows, files, bytes) in the job summary.
#            Nothing leaves the runner.
#   apply    the same, then: an on-demand snapshot of the work volume, maintenance mode on the work Machine,
#            upload over flyctl ssh sftp (WireGuard), infrastructure/migrate/work/apply.sh (the data in place is moved
#            to /data/backups/work-<time>/ first, every file is checked against the manifest, SQLite integrity check),
#            maintenance mode off, then the work smoke checks through the preview cookie. Type APPLY to confirm.
#
# The export holds personal data (accounts, sessions, uploaded files). It is NEVER uploaded as an artifact, never
# printed (the tools' own output goes to files on the runner, and only counts are shown), and it is deleted from the
# runner at the end, whatever happens. Write freeze: announce a window and stop changes on work.kevos.com before an
# apply that is meant to be final (the last apply wins; earlier backups stay in /data/backups).
#
# Repository secrets: CLOUDFLARE_API_TOKEN (D1 read and R2 read on the account), CLOUDFLARE_ACCOUNT_ID, and for
# apply FLY_API_TOKEN (an organization or deploy token for bizomat).
# The migration scripts (apps/work/scripts/migrate, apps/work/docs/NODE-RUNTIME.md) are called as:
#   node scripts/migrate/import-d1-dump.mjs <dump.sql> <data folder>
#   node scripts/migrate/repair-text-from-d1.mjs <data folder> --remote --database <db> --env preview
#   node scripts/migrate/copy-r2-objects.mjs <data folder> --bucket <bucket> --remote   (Cloudflare credentials from the env)
#   node scripts/migrate/verify-data-dir.mjs <data folder>
name: BIZOMAT migrate work data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run (export and count) or apply (replace the data on the work Machine)
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirm:
        description: For apply, type APPLY
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bizomat-migrate-work
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP: bizomat
      D1_DATABASE: workos-platform-preview-db
      R2_BUCKET: workos-platform-preview-files
      MODE: ${{ inputs.mode }}
    steps:
      - name: Check the inputs and secrets
        env:
          CONFIRM: ${{ inputs.confirm }}
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_FLY: ${{ secrets.FLY_API_TOKEN != '' }}
        run: |
          [ "$HAS_CF" = "true" ] || { echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          if [ "$MODE" = "apply" ]; then
            [ "$CONFIRM" = "APPLY" ] || { echo "::error::apply replaces the data on the work Machine: type APPLY in the confirm box."; exit 1; }
            [ "$HAS_FLY" = "true" ] || { echo "::error::apply needs the repository secret FLY_API_TOKEN."; exit 1; }
          fi
          echo "W=$RUNNER_TEMP/work-migration" >> "$GITHUB_ENV"
          echo "STAMP=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install the work app's tools (wrangler, the migration scripts' packages)
        working-directory: apps/work
        run: npm ci --no-audit --no-fund >/dev/null

      - name: Export D1 (stays on the runner)
        working-directory: apps/work
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          umask 077
          mkdir -p "$W/data" "$W/logs"
          if ! npx wrangler d1 export "$D1_DATABASE" --env preview --remote --output "$W/d1-dump.sql" >"$W/logs/d1.log" 2>&1; then
            echo "::error::The D1 export failed. Its output stays on the runner and is not shown (it can hold data)."
            exit 1
          fi
          echo "D1 export: $(wc -c <"$W/d1-dump.sql") bytes"

      - name: Build the data folder from the dump (db.sqlite with the exact D1 schema)
        working-directory: apps/work
        run: |
          # import-d1-dump.mjs checks integrity, foreign keys, migrations and schema, and rows per table against the
          # dump, and fails on failed rows or duplicate keys (apps/work/docs/NODE-RUNTIME.md).
          if ! node scripts/migrate/import-d1-dump.mjs "$W/d1-dump.sql" "$W/data" >"$W/logs/import.log" 2>&1; then
            echo "::error::import-d1-dump.mjs failed (its output is not shown: it can hold data). Run it locally on a copy to see why."
            exit 1
          fi
          rm -f "$W/d1-dump.sql"

      - name: Repair text values the D1 export makes ambiguous (literal backslash-n)
        working-directory: apps/work
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! node scripts/migrate/repair-text-from-d1.mjs "$W/data" --remote --database "$D1_DATABASE" --env preview >"$W/logs/repair.log" 2>&1; then
            echo "::error::repair-text-from-d1.mjs failed (its output is not shown). Run it locally to see why."
            exit 1
          fi

      - name: Copy the R2 objects the database references
        working-directory: apps/work
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! node scripts/migrate/copy-r2-objects.mjs "$W/data" --bucket "$R2_BUCKET" --remote >"$W/logs/r2.log" 2>&1; then
            echo "::error::copy-r2-objects.mjs failed (its output is not shown). Run it locally to see why."
            exit 1
          fi

      - name: Verify the data folder (database, files, checksums)
        working-directory: apps/work
        run: |
          if ! node scripts/migrate/verify-data-dir.mjs "$W/data" >"$W/logs/verify.log" 2>&1; then
            echo "::error::verify-data-dir.mjs found a problem (its output is not shown). Run the migration locally to see it."
            exit 1
          fi

      - name: Counts (the only thing reported)
        run: |
          {
            echo "## Project Management migration: $MODE"
            echo
            python3 infrastructure/migrate/work/counts.py "$W/data/db.sqlite" --markdown
            echo
            echo "Files: $(find "$W/data/files" -type f | wc -l), $(du -sb "$W/data/files" | cut -f1) bytes."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Pack for the work Machine
        if: inputs.mode == 'apply'
        run: |
          bash infrastructure/migrate/work/pack.sh "$W/data" "$W/work-$STAMP.tar" 2>&1 | grep '^pack: packed'

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        if: inputs.mode == 'apply'

      - name: Snapshot the work volume, then maintenance mode on the work Machine
        if: inputs.mode == 'apply'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          vol="$(flyctl volumes list --app "$APP" --json | jq -r '[.[] | select(.name == "work_data")][0].id')"
          [ -n "$vol" ] && [ "$vol" != "null" ] || { echo "::error::no work_data volume on $APP"; exit 1; }
          flyctl volumes snapshots create "$vol" --app "$APP" >/dev/null
          machine="$(flyctl machines list --app "$APP" --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "work")][0].id')"
          [ -n "$machine" ] && [ "$machine" != "null" ] || { echo "::error::no work Machine on $APP"; exit 1; }
          echo "MACHINE=$machine" >>"$GITHUB_ENV"
          flyctl ssh console --app "$APP" --machine "$machine" -C "touch /data/.bizomat-maintenance"
          flyctl machine restart "$machine" --app "$APP" --skip-health-checks
          sleep 10

      - name: Upload and apply (the previous data is kept in /data/backups)
        if: inputs.mode == 'apply'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh sftp put "$W/work-$STAMP.tar" "/data/incoming/work-$STAMP.tar" --app "$APP" --machine "$MACHINE" -m 0600 >/dev/null
          status=0
          flyctl ssh console --app "$APP" --machine "$MACHINE" \
            -C "/usr/local/lib/bizomat/migrate/work/apply.sh /data/incoming/work-$STAMP.tar" >"$W/logs/apply.log" 2>&1 || status=$?
          { echo; echo "### On the work Machine"; echo; echo '```'; grep '^counts:' "$W/logs/apply.log" || true; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then
            echo "::error::apply.sh failed (exit $status); the Machine stays in maintenance mode with its previous data untouched or in /data/backups. Inspect with: flyctl ssh console -a $APP --machine $MACHINE"
            exit 1
          fi
          flyctl ssh console --app "$APP" --machine "$MACHINE" -C "rm -f /data/incoming/work-$STAMP.tar"

      - name: Maintenance mode off, then check work through the preview cookie
        if: inputs.mode == 'apply'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console --app "$APP" --machine "$MACHINE" -C "rm -f /data/.bizomat-maintenance"
          flyctl machine restart "$MACHINE" --app "$APP"
          node infrastructure/smoke/smoke.mjs "https://$APP.fly.dev" --mode preview --skip web,cad --wait 180

      - name: Delete the export from the runner
        if: always()
        run: |
          if [ -n "${W:-}" ]; then rm -rf "$W"; fi
