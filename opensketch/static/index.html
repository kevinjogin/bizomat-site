<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenSketch</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var c=document.documentElement.classList,k='linear',t='dark';try{if(localStorage.getItem('opensketch.skin')==='classic'){k='classic';t='light'}else if(localStorage.getItem('opensketch.theme')==='light'){t='light'}}catch(e){}c.add('skin-'+k,'theme-'+t)})()</script>
<meta name="theme-color" content="#0c0d0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f6" media="(prefers-color-scheme: light)">
<meta name="description" content="OpenSketch: parametric CAD in the browser, with an AI that builds while you watch.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OpenSketch">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Inter+Tight:wght@600..800&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/linear.css">
<link rel="stylesheet" href="css/brand.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="brand"><span class="brand-text">OpenSketch</span></div>
    <div id="menu-flyout" class="menu-flyout" title="Menu">&#9656;</div>
    <nav id="menubar" class="menubar hidden"></nav>
    <div id="quickaccess" class="quickaccess"></div>
    <div id="doctitle" class="doctitle">Part1 *</div>
    <form class="search" role="search" autocomplete="off" data-own-form><input id="cmdsearch" type="search" name="os-command-search" placeholder="Search Commands" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search commands" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other"><div id="cmdsearch-results" class="search-results hidden"></div></form>
    <div class="title-help" title="Help">?</div>
    <div id="account" class="account" title="Account"></div>
  </header>

  <section id="cmdmgr">
    <div id="ribbon" class="ribbon"></div>
    <div id="cmdtabs" class="cmdtabs"></div>
  </section>

  <main id="main">
    <aside id="leftpanel">
      <div id="mgrtabs" class="mgrtabs"></div>
      <div id="featuremgr" class="panel-body">
        <form class="tree-filter" role="search" autocomplete="off" data-own-form><input id="treefilter" type="search" name="os-tree-filter" placeholder="&#x1F50D;&#xFE0E; Filter" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Filter the design tree" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other"></form>
        <div id="tree" class="tree" tabindex="0"></div>
      </div>
      <div id="propmgr" class="panel-body hidden"></div>
    </aside>
    <div id="splitter" class="splitter"></div>

    <section id="graphics">
      <div id="viewport"></div>
      <div id="labels" class="labels"></div>
      <div id="flyout-tree" class="flyout-tree hidden"></div>
      <div id="breadcrumbs" class="breadcrumbs"></div>
      <div id="editbar" class="editbar hidden"></div>
      <div id="livecap" class="livecap hidden"></div>
      <div id="headsup" class="headsup"></div>
      <div id="confirmcorner" class="confirmcorner hidden"></div>
      <div id="sketchcursor" class="sketchcursor hidden"></div>
      <div id="contexttb" class="contexttb hidden"></div>
      <div id="shortcutbar" class="shortcutbar hidden"></div>
      <div id="selbox" class="selbox hidden"></div>
      <div id="viewcube" class="viewcube-pop hidden"></div>
      <div id="doctabs" class="doctabs">
        <span class="doctab active">Model</span><span class="doctab">3D Views</span><span class="doctab">Motion Study 1</span>
      </div>
      <div id="busyind" class="busyind hidden" role="status" aria-live="polite"><i class="busy-spin"></i><span class="busy-label">Loading model...</span></div>
      <div id="toast" class="toast hidden"></div>
    </section>

    <aside id="taskpane">
      <div id="taskpanel" class="taskpanel hidden"></div>
      <div id="taskstrip" class="taskstrip"></div>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="sb-msg" class="sb-msg"></span>
    <span class="sb-spacer"></span>
    <span id="sb-coords" class="sb-cell"></span>
    <span id="sb-defined" class="sb-cell"></span>
    <span id="sb-editing" class="sb-cell">Editing Part</span>
    <span id="sb-units" class="sb-cell sb-units" title="Unit system">MMGS &#9662;</span>
    <span id="sb-help" class="sb-cell sb-help" title="Help">?</span>
  </footer>
</div>

<div id="contextmenu" class="contextmenu hidden"></div>
<div id="modal-layer"></div>
<input id="fileinput" type="file" accept=".osk,.json,.step,.stp,.brd,.zip,.sldprt,.sldasm" class="hidden">

<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="js/app.js"></script>
<script>if ('serviceWorker' in navigator && typeof window.OPENSKETCH_REVIEW !== 'string' && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) addEventListener('load', function () { navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {}); });</script>
</body>
</html>
