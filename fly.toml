# Fly.io app "cados" (https://cados.fly.dev): OpenSketch in Sydney on one dedicated CPU core with 2 GB, suspended
# when idle (woken by the next request). A dedicated core because on shared CPU, heavy CAD work uses up the burst
# allowance. Billed only while it runs; a linked add-in's long poll keeps it awake. Inside, `--supervise`
# (Dockerfile) restarts the server when it stops answering.
# Deployed by .github/workflows/deploy.yml on every push to main (tests first) once the repository has the
# FLY_API_TOKEN and OPENSKETCH_PASSWORD secrets. Without OPENSKETCH_PASSWORD the public site would be open.
# Settings: https://fly.io/docs/reference/configuration/

app = 'cados'
primary_region = 'syd'
kill_timeout = '15s'

[build]
  dockerfile = 'Dockerfile'

[env]
  OPENSKETCH_DATA = '/data'

[[mounts]]
  source = 'opensketch_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 1000
    soft_limit = 200

[[vm]]
  size = 'performance-1x'
  memory = '2gb'
