# Temporary diagnostic: how long a WORKOS calculator link takes to open on the live kevos.com at phone network speeds.
name: Live check (tool open time)
on:
  push:
    branches: [claude/loving-mccarthy-oubwh2]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium
        run: npm i --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Time to calculator at phone speeds
        shell: bash
        run: |
          cat > check.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const note = (t, m) => console.log(`::notice title=${t}::${m}`);
          const NETS = {
            'wifi (no throttle)': null,
            '4G (9 Mbps, 85 ms)': { latency: 85, downloadThroughput: 9e6 / 8, uploadThroughput: 1.5e6 / 8 },
            'slow 4G (1.6 Mbps, 150 ms)': { latency: 150, downloadThroughput: 1.6e6 / 8, uploadThroughput: 0.75e6 / 8 },
          };
          const b = await chromium.launch();
          for (const [name, net] of Object.entries(NETS)) {
            const ctx = await b.newContext(devices['iPhone 13']);
            const p = await ctx.newPage();
            const cdp = await ctx.newCDPSession(p);
            await cdp.send('Network.enable');
            await cdp.send('Network.setCacheDisabled', { cacheDisabled: true });
            if (net) await cdp.send('Network.emulateNetworkConditions', { offline: false, ...net });
            await cdp.send('Emulation.setCPUThrottlingRate', { rate: 4 });
            let bytes = 0, reqs = 0;
            p.on('response', async (r) => { reqs++; const l = Number(r.headers()['content-length'] || 0); bytes += l; });
            const t0 = Date.now();
            await p.goto('https://kevos.com/tools/?tool=axial-stress', { waitUntil: 'commit' });
            await p.waitForSelector('#tool-directory', { state: 'attached', timeout: 60000 });
            const directoryAt = Date.now() - t0;
            await p.waitForFunction(() => document.querySelector('#tool-workspace') && !document.querySelector('#tool-workspace').hidden, null, { timeout: 120000, polling: 100 }).catch(() => {});
            const calcAt = Date.now() - t0;
            note(`open time, ${name}`, `directory visible after ${(directoryAt / 1000).toFixed(1)} s; calculator shown after ${(calcAt / 1000).toFixed(1)} s; ${reqs} requests`);
            await ctx.close();
          }
          await b.close();
          JS
          node check.mjs
