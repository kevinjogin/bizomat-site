name: Deploy production

# Only `main` deploys to production, and only through the protected
# `production` GitHub environment (configure required reviewers in
# Settings -> Environments -> production). Targets ONLY the
# workos-platform-production Worker and its own D1/R2/KV.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full validation
        run: npm run lint && npm run typecheck && npm run build:client && npm test && npm run build:worker
      - name: Backup production database before migrating
        run: npx wrangler d1 export workos-platform-production-db --remote --output "backup-${GITHUB_SHA::7}.sql" --env production
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.sha }}
          path: backup-*.sql
          retention-days: 30
      - name: Apply migrations
        run: npx wrangler d1 migrations apply DB --remote --env production
      - name: Deploy
        run: npx wrangler deploy --env production --message "${GITHUB_SHA::7} ${{ github.event.head_commit.message || 'manual' }}"
      - name: Smoke test production
        id: smoke
        run: node scripts/smoke.mjs "${{ vars.PRODUCTION_URL }}"
      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        run: npx wrangler rollback --env production --message "Automatic rollback after failed smoke test" -y
