# Fly.io app "cados" (public address https://bizomat.ai/cad; old addresses https://cados.kevos.com and the origin
# https://cados.fly.dev): BIZOMAT CAD Automation (formerly CADOS by KEVOS), suspended when idle (woken by the next
# request). Billed only while it runs; a linked add-in's long poll keeps it awake. Inside, `--supervise` (Dockerfile)
# restarts the server when it stops answering.
#
# This file matches the Machine production runs, as read with `fly scale show -a cados` and `fly volumes list -a
# cados` on 9 Nov 2026: one Machine in Amsterdam (ams), shared CPU, 2 vCPUs, 2048 MB, and the 1 GB volume
# opensketch_data in ams. (Earlier versions of this file said syd and performance-1x; the app was never in Sydney.)
# Moving it to Sydney means moving the volume and is a production change of its own: never do it in a deploy.
#
# Deployed only by hand from GitHub Actions (deploy.yml in kevinjogin/bizomat-cad): its preflight
# (.github/scripts/fly-preflight.py) stops any deploy that would change the Machine's region, size or memory.
# No server password: with OPENSKETCH_PUBLIC_URL below set, a server with no account answers only its setup page until
# the first person creates the owner account. fly-status.yml reads the app's state and logs.
# Settings: https://fly.io/docs/reference/configuration/

app = 'cados'
primary_region = 'ams'
kill_timeout = '15s'

[build]
  dockerfile = 'Dockerfile'

[env]
  OPENSKETCH_DATA = '/data'
  # The public address (OAuth metadata, links, canonical tags): CAD Automation lives under the BIZOMAT website's own
  # address, at bizomat.ai/cad (opensketch/canonical.py serves the prefix and writes it into every link). Browsers on
  # an old host are sent there with a 301; health checks, MCP, OAuth, /api/ and the device API are not redirected and
  # keep their own host's address for connectors, add-ins and computers set up with it.
  OPENSKETCH_PUBLIC_URL = 'https://bizomat.ai/cad'
  OPENSKETCH_REDIRECT_HOSTS = 'cados.fly.dev,cados.kevos.com,cad.bizomat.ai'

[[mounts]]
  source = 'opensketch_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Always on (14 Nov 2026). bizomat.ai/cad reaches this app over Fly's private network (cados.internal:8080 from the
  # Fly app bizomat), which neither counts as traffic for auto-stop nor wakes a stopped Machine: with 'suspend' the
  # Machine slept at 22:33 UTC while a paired computer was polling through bizomat.ai, and bizomat.ai/cad answered 502
  # until something reached cados.fly.dev. Same Machine, same size: only the sleep is off. Letting it sleep again needs
  # the router to reach it through Flycast (a private Flycast address for cados, then UPSTREAM_CAD on bizomat).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 1000
    soft_limit = 200

# The live Machine: shared CPU, 2 vCPUs, 2048 MB (shared-cpu-2x with 2 GB).
[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
